ue nadie quede atrapado en medio del cruce."}, {"id": "b6-26", "tema": "Señales y demarcaciones", "cap": "6 · pág. 83", "q": "¿Puede circular o estacionar sobre las áreas ACHURADAS (rayadas) de la calzada?", "ops": ["Sí, para estacionar un momento", "No: ni circular ni estacionar", "Sí, para adelantar a otro vehículo", "Sólo motos y bicicletas"], "ok": 1, "exp": "Las áreas achuradas canalizan los flujos. No se usan para circular ni estacionar."}, {"id": "b6-27", "tema": "Señales y demarcaciones", "cap": "6 · pág. 84", "q": "Un camión grande vira y necesita invadir su pista para completar el giro. ¿Qué hace?", "ops": ["Avanza para no perder su lugar", "Se detiene y espera que el camión termine", "Toca la bocina para que el camión espere", "Lo adelanta por la derecha"], "ok": 1, "exp": "Un vehículo grande puede necesitar más de una pista para virar. Déjele espacio."}, {"id": "b6-28", "tema": "Prioridades y virajes", "cap": "6 · pág. 84", "q": "Llega a un cruce sin semáforo, sin Carabinero y sin señales PARE ni CEDA EL PASO. ¿A quién debe dar preferencia?", "ops": ["A los que vienen por su izquierda", "A los que vienen por su derecha", "Al vehículo más grande", "A nadie: pasa quien llega primero"], "ok": 1, "exp": "Regla de la derecha: preferencia a quien viene por la derecha."}, {"id": "b6-29", "tema": "Prioridades y virajes", "cap": "6 · pág. 84", "q": "¿Qué preferencia tiene usted cuando va a VIRAR?", "ops": ["Toda la preferencia, si señalizó", "Ninguna", "Sólo sobre los peatones", "Sólo sobre los que vienen de frente"], "ok": 1, "exp": "Al virar, se pierde toda preferencia."}, {"id": "b6-30", "tema": "Prioridades y virajes", "cap": "6 · pág. 84", "q": "Llega a una rotonda o minirrotonda. ¿Quién tiene preferencia?", "ops": ["Usted, si viene por la derecha", "Los que ya circulan por la rotonda", "El vehículo más rápido", "El que toque la bocina primero"], "ok": 1, "exp": "Al incorporarse a una rotonda debe ceder el paso a quienes circulan por ella."}, {"id": "b6-31", "tema": "Prioridades y virajes", "cap": "6 · pág. 85", "q": "En el campo, sale de un camino secundario a una ruta principal sin señales. ¿Quién tiene preferencia?", "ops": ["Usted, porque viene por la derecha", "Los que circulan por la vía principal", "El que llegue primero", "El vehículo más grande"], "ok": 1, "exp": "En áreas rurales, quien llega por una vía secundaria cede el paso a la vía principal."}, {"id": "b6-32", "tema": "Prioridades y virajes", "cap": "6 · pág. 85", "q": "¿Qué significa exactamente «ceder el paso»?", "ops": ["Detenerse siempre al menos 3 segundos", "Que el otro no deba frenar ni desviarse", "Tocar la bocina antes de pasar", "Pasar despacio para que el otro lo vea"], "ok": 1, "exp": "Si el otro tuvo que frenar o desviarse por usted, no cedió el paso. Reduzca la velocidad con tiempo y muestre claramente su intención."}, {"id": "b6-33", "tema": "Prioridades y virajes", "cap": "6 · pág. 85", "q": "Sale de su casa o de un estacionamiento a la calle. ¿A quién debe ceder el paso?", "ops": ["Sólo a los automóviles", "A vehículos, ciclistas y peatones", "A nadie, si toca la bocina antes", "Sólo a los peatones en la vereda"], "ok": 1, "exp": "Al incorporarse desde un inmueble, vía particular o estacionamiento, o al reanudar la marcha tras detenerse, se cede el paso a todos."}, {"id": "b6-34", "tema": "Prioridades y virajes", "cap": "6 · pág. 85", "q": "Su pista queda bloqueada de repente por un obstáculo y necesita cambiarse a la pista de al lado. ¿Tiene preferencia?", "ops": ["Sí, porque es una emergencia", "No: no tiene prioridad", "Sí, si pone el intermitente", "Sí, si toca la bocina"], "ok": 1, "exp": "Quien cambia de pista, aunque sea por un obstáculo, debe esperar a tener espacio."}, {"id": "b6-35", "tema": "Prioridades y virajes", "cap": "6 · pág. 85", "q": "Va por una pista demarcada para vehículos de emergencia y se acerca una ambulancia con sirena por detrás. ¿Qué hace?", "ops": ["Acelera para no estorbarla", "Sale de esa pista apenas pueda hacerlo con seguridad", "Frena en seco en la pista", "Se queda en la pista: la ambulancia lo adelantará"], "ok": 1, "exp": "Vehículos policiales, de bomberos, ambulancias y PDI con señales luminosas o sonoras tienen derecho a vía."}, {"id": "b6-36", "tema": "Prioridades y virajes", "cap": "6 · pág. 85", "q": "El vehículo de adelante enciende su intermitente IZQUIERDO en una carretera. ¿Qué significa?", "ops": ["Que le indica que puede adelantarlo", "Que va a virar o moverse a la izquierda", "Que tiene una falla en las luces", "Que va a estacionarse a la derecha"], "ok": 1, "exp": "Interpretar el intermitente izquierdo como «pase» es un error que causa siniestros graves."}, {"id": "b6-37", "tema": "Prioridades y virajes", "cap": "6 · pág. 86", "q": "¿Con cuánta anticipación mínima debe señalizar que va a virar?", "ops": ["5 metros", "Al menos 30 metros", "100 metros siempre", "No es obligatorio"], "ok": 1, "exp": "Al menos 30 m antes. En carretera a 100 km/h, el libro sugiere unos 300 a 400 m. Secuencia: espejo – señalización – maniobra."}, {"id": "b6-38", "tema": "Prioridades y virajes", "cap": "6 · pág. 86", "q": "Un conductor saca el brazo izquierdo por la ventana en ángulo recto hacia ARRIBA. ¿Qué indica?", "ops": ["Viraje a la izquierda", "Viraje a la derecha", "Detención", "Saludo"], "ok": 1, "exp": "Brazo horizontal: izquierda. Brazo en ángulo recto hacia arriba: derecha. Brazo hacia abajo: reducir velocidad o detenerse."}, {"id": "b6-39", "tema": "Prioridades y virajes", "cap": "6 · pág. 87", "q": "¿Cuándo se puede usar la bocina?", "ops": ["Para saludar a conocidos", "Sólo para prevenir un siniestro", "Para apurar a quien no avanza en verde", "Siempre que quiera, salvo de noche"], "ok": 1, "exp": "La bocina es sólo para evitar un siniestro."}, {"id": "b6-40", "tema": "Distancias", "cap": "6 · pág. 87", "q": "Según la regla del libro para carreteras, si circula a 80 km/h, ¿qué distancia aproximada debe mantener con el vehículo de adelante?", "ops": ["Unos 8 metros", "Unos 80 metros", "Unos 20 metros", "Unos 200 metros"], "ok": 1, "exp": "Regla: tantos metros como km/h marca el velocímetro. En tránsito urbano, la mitad."}, {"id": "b6-41", "tema": "Distancias", "cap": "6 · pág. 88", "q": "¿En qué consiste la «Regla de los Tres Segundos»?", "ops": ["Esperar 3 segundos en cada PARE", "Contar 3 s tras el paso del de adelante", "Mirar el espejo cada 3 segundos", "Frenar 3 segundos antes de cada curva"], "ok": 1, "exp": "Se usa en carreteras. Agregue tiempo extra con mal clima o pavimento malo."}, {"id": "b6-42", "tema": "Distancias", "cap": "6 · pág. 88", "q": "¿Cuál es la causa más frecuente de los choques en serie (en cadena)?", "ops": ["Los semáforos mal sincronizados", "Ir demasiado cerca del de adelante", "Las luces traseras mal ajustadas", "El mal estado del pavimento urbano"], "ok": 1, "exp": "Sin distancia suficiente no hay tiempo para frenar. En congestión, ponga más atención y tenga el pie listo sobre el freno."}, {"id": "b6-43", "tema": "Distancias", "cap": "6 · pág. 89", "q": "En la ciudad, va detrás de un auto con patente extranjera. ¿Qué recomienda el libro?", "ops": ["Adelantarlo cuanto antes", "Aumentar la distancia con él", "Tocarle la bocina para que avance", "Nada especial: es un auto más"], "ok": 1, "exp": "Quien no conoce el lugar es más imprevisible."}, {"id": "b6-44", "tema": "Distancias", "cap": "6 · pág. 89", "q": "Pasa junto a una fila de autos estacionados. ¿Qué distancia lateral debe dejar?", "ops": ["Unos 10 cm", "El ancho de una puerta", "No importa si va despacio", "Medio metro"], "ok": 1, "exp": "Alguien puede abrir una puerta, bajar o salir del estacionamiento sin avisar, o un peatón puede aparecer entre los autos."}, {"id": "b6-45", "tema": "Distancias", "cap": "6 · pág. 105", "q": "Se detiene detrás de otro vehículo esperando la luz verde. ¿Qué distancia es adecuada?", "ops": ["Pegado a su parachoques", "Ver sus neumáticos traseros", "5 metros exactos", "El largo de un bus"], "ok": 1, "exp": "Así tiene espacio para maniobrar si el de adelante falla, y evita ser empujado contra él en un choque por detrás."}, {"id": "b6-46", "tema": "Pistas y virajes", "cap": "6 · pág. 90", "q": "En la ciudad, ¿cuándo puede circular por la pista izquierda de una calle de doble sentido?", "ops": ["Siempre que haya espacio libre", "Para adelantar, por obras, con 3+ pistas o un sentido", "Nunca en la ciudad, salvo emergencia", "Sólo de noche con poco tránsito"], "ok": 1, "exp": "Regla general: circular por la mitad derecha de la calzada. En autopistas y carreteras se recomienda la derecha y dejar libre la izquierda para adelantar."}, {"id": "b6-47", "tema": "Pistas y virajes", "cap": "6 · pág. 90", "q": "Hay tres pistas en su sentido y usted va por la de la derecha. ¿Puede pasar directamente a la de la izquierda en una sola maniobra?", "ops": ["Sí, si señaliza con anticipación", "No: se cambia una pista a la vez", "Sí, de noche", "Sí, si no hay nadie cerca"], "ok": 1, "exp": "Los cambios de pista se hacen de a uno, con espejos, mirada por sobre el hombro y señalización con anticipación."}, {"id": "b6-48", "tema": "Pistas y virajes", "cap": "6 · pág. 91", "q": "Va a virar a la derecha y hay una ciclovía a su derecha. ¿Cómo se posiciona?", "ops": ["Sobre la ciclovía, si no vienen ciclistas", "Pegado al separador de la ciclovía, sin invadirla", "En el centro de la calle", "En la pista izquierda"], "ok": 1, "exp": "Sin ciclovía, se acerca lo más posible al borde derecho. Revise espejos por ciclistas, ceda el paso a peatones y apague el señalizador al terminar."}, {"id": "b6-49", "tema": "Pistas y virajes", "cap": "6 · pág. 92", "q": "Espera para virar a la izquierda en una vía de doble sentido mientras pasan los autos de frente. ¿Cómo deben estar sus ruedas delanteras?", "ops": ["Giradas a la izquierda, listas para virar", "Rectas, orientadas hacia adelante", "Giradas a la derecha", "No importa"], "ok": 1, "exp": "Si lo chocan por detrás con las ruedas giradas a la izquierda, sería lanzado a la pista contraria: colisión frontal. Deténgase unos metros antes, ruedas rectas."}, {"id": "b6-50", "tema": "Pistas y virajes", "cap": "6 · pág. 93", "q": "¿Qué tipo de choque es muy frecuente cuando un vehículo va a virar a la izquierda?", "ops": ["Choques laterales con peatones", "Choques por atrás (alcances)", "Volcamientos", "Choques contra postes"], "ok": 1, "exp": "Por eso hay que mirar los espejos mucho antes y señalizar con tiempo. Y renunciar al viraje si está cerca de un cambio de rasante o una curva sin visibilidad."}, {"id": "b6-51", "tema": "Pistas y virajes", "cap": "6 · pág. 94", "q": "¿Dónde está PROHIBIDO virar en «U»?", "ops": ["En avenidas con bandejón central", "En cruces, pasos peatonales y cerca de curvas", "En calles de doble sentido sin línea continua", "En ninguna parte, si hay visibilidad"], "ok": 1, "exp": "El viraje en U se permite en vías de doble sentido sin línea central continua o en avenidas con bandejón, salvo donde esté prohibido."}, {"id": "b6-52", "tema": "Pistas y virajes", "cap": "6 · pág. 94", "q": "Circula dentro de una rotonda. ¿Cuándo debe poner el intermitente derecho?", "ops": ["Al entrar a la rotonda", "Al pasar la salida anterior a la suya", "No es necesario en rotondas", "Después de salir de la rotonda"], "ok": 1, "exp": "Decida pronto su salida para entrar por la pista correcta, reduzca la velocidad y ceda el paso a quienes ya circulan."}, {"id": "b6-53", "tema": "Pistas y virajes", "cap": "6 · pág. 95", "q": "¿Para qué sirven las «pistas de emergencia» en pendientes muy pronunciadas?", "ops": ["Para estacionar en caso de avería", "Para vehículos que se quedan sin frenos", "Para adelantar a camiones lentos", "Para el paso exclusivo de ambulancias"], "ok": 1, "exp": "Se habilitan en bajadas fuertes para detener vehículos que se quedaron sin frenos."}, {"id": "b6-54", "tema": "Pistas y virajes", "cap": "6 · pág. 95", "q": "Una pista exclusiva para buses está separada con línea discontinua en el lugar donde usted debe virar. ¿Puede entrar?", "ops": ["Nunca, en ningún caso", "Sólo con línea discontinua y para virar", "Siempre que no venga un bus", "Sólo si va apurado y con balizas"], "ok": 1, "exp": "En las demás situaciones no se ingresa a pistas o vías exclusivas para transporte público en sus horarios."}, {"id": "b6-55", "tema": "Velocidad", "cap": "6 · pág. 96", "doble": true, "q": "Según el libro, ¿cuál es la velocidad máxima en zonas URBANAS?", "ops": ["40 km/h", "50 km/h", "60 km/h", "70 km/h"], "ok": 1, "exp": "50 km/h en zonas urbanas, salvo señal distinta."}, {"id": "b6-56", "tema": "Velocidad", "cap": "6 · pág. 96", "doble": true, "q": "Un vehículo liviano en zona rural, en un camino con dos o más pistas en el mismo sentido: ¿velocidad máxima?", "ops": ["90 km/h", "100 km/h", "120 km/h", "130 km/h"], "ok": 2, "exp": "Una pista por sentido: 100 km/h. Dos o más pistas en el mismo sentido: 120 km/h. Buses, camiones y transporte escolar: 90 km/h; buses interurbanos: 100 km/h."}, {"id": "b6-57", "tema": "Velocidad", "cap": "6 · pág. 96", "doble": true, "q": "¿Cuál es la velocidad máxima para un CAMIÓN en carretera, según el libro?", "ops": ["120 km/h", "100 km/h", "90 km/h", "80 km/h"], "ok": 2, "exp": "Buses, camiones y vehículos de transporte escolar: no más de 90 km/h. Importante si conduce camiones del campo por la ruta."}, {"id": "b6-58", "tema": "Velocidad", "cap": "6 · pág. 96", "q": "¿Cuántos metros necesita aproximadamente para detenerse a 50 km/h en pavimento seco y bueno, y a 100 km/h?", "ops": ["Unos 10 m y unos 20 m", "Unos 25 m y unos 80 m", "Unos 50 m y unos 100 m", "Unos 5 m y unos 10 m"], "ok": 1, "exp": "A 50 km/h unos 25 m; a 100 km/h unos 80 m. Al doble de velocidad, mucho más del doble de distancia."}, {"id": "b6-59", "tema": "Velocidad", "cap": "6 · pág. 96", "doble": true, "q": "¿Qué es una velocidad «razonable y prudente»?", "ops": ["La máxima que indica la señal", "Una que le permita detenerse a tiempo", "La misma del resto del tránsito", "10 km/h menos que el límite"], "ok": 1, "exp": "El límite de la señal es un máximo, no un objetivo. Hay que reducir con mala visibilidad, curvas, cimas, caminos angostos, pavimento resbaladizo, niños o animales cerca, obras o siniestros."}, {"id": "b6-60", "tema": "Velocidad", "cap": "6 · pág. 97", "doble": true, "q": "¿A cuánto debe reducir su velocidad frente a un colegio en horario de entrada y salida de clases?", "ops": ["A no más de 20 km/h", "A no más de 30 km/h", "A no más de 40 km/h", "A 50 km/h"], "ok": 1, "exp": "A las afueras de un colegio en horas de entrada y salida: no más de 30 km/h."}, {"id": "b6-61", "tema": "Velocidad", "cap": "6 · pág. 97", "q": "Un bus de transporte escolar se ha detenido para dejar niños. ¿Qué hace?", "ops": ["Lo adelanta rápido por la izquierda", "Reduce y se detiene si es necesario", "Toca la bocina para avisar", "Nada: los niños bajan por la vereda"], "ok": 1, "exp": "La ley obliga a reducir la velocidad ante transporte colectivo o escolar detenido, y a detenerse si es necesario."}, {"id": "b6-62", "tema": "Velocidad", "cap": "6 · pág. 97", "q": "¿Cuál de estas frases describe la conducción A LA DEFENSIVA?", "ops": ["Confiar en que los demás respetan las reglas", "Precaución, desconfianza, distancia y mirar antes de actuar", "Ir siempre al límite para no estorbar", "Usar la bocina para hacerse notar"], "ok": 1, "exp": "Conducir a la defensiva es anticipar los errores de los demás."}, {"id": "b6-63", "tema": "Velocidad", "cap": "6 · pág. 97", "q": "Conduce por una calle arbolada en un día de sol, con manchas de luz y sombra. ¿Qué hace?", "ops": ["Acelera para salir rápido de la zona", "Reduce la velocidad", "Enciende las luces altas", "Nada especial con buen tiempo"], "ok": 1, "exp": "Adapte la velocidad al pavimento, clima, visibilidad, estado del vehículo, carga y tráfico."}, {"id": "b6-64", "tema": "Velocidad", "cap": "6 · pág. 98", "q": "Va a conducir un vehículo prestado o arrendado que no conoce. ¿Qué recomienda el libro?", "ops": ["Probar su velocidad máxima para conocerlo", "Conducirlo con calma hasta conocerlo", "Nada especial: todos se conducen igual", "Desactivar el ABS para sentir mejor los frenos"], "ok": 1, "exp": "Antes de partir: ¿tracción delantera, trasera o 4x4? ¿qué frenos tiene? ¿dónde está su centro de gravedad?"}, {"id": "b6-65", "tema": "Velocidad", "cap": "6 · pág. 100", "q": "En 10 km, ¿cuánto tiempo gana si sube de 60 a 80 km/h?", "ops": ["Unos 10 minutos", "Unos 2 minutos y 30 segundos", "Unos 30 minutos", "Unos 6 minutos"], "ok": 1, "exp": "La ganancia de tiempo es pequeña y el riesgo aumenta mucho. Ir al máximo no reporta un ahorro significativo."}, {"id": "b6-66", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 98", "q": "Dos vehículos circulan en sentido contrario, uno a 90 y otro a 100 km/h. ¿A qué velocidad se aproximan entre sí?", "ops": ["10 km/h", "100 km/h", "190 km/h", "95 km/h"], "ok": 2, "exp": "Se acercan a la suma de las velocidades. Por eso hay tan poco tiempo para decidir en un adelantamiento."}, {"id": "b6-67", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 99", "q": "Un vehículo que viene de frente invade SU lado de la calzada. ¿Qué indica el libro?", "ops": ["Desviarse a la izquierda para esquivarlo", "Frenar, hacer señales y moverse a la derecha", "Acelerar para pasar antes", "Quedarse quieto en el centro"], "ok": 1, "exp": "Si se pasa a la izquierda, el otro conductor puede darse cuenta y volver a su lado: chocarían de frente."}, {"id": "b6-68", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 99", "q": "Al cruzarse con otro vehículo de noche o en camino estrecho, ¿hacia dónde debe mirar?", "ops": ["Fijo al vehículo que viene", "Lejos, al borde derecho", "Al espejo retrovisor", "Al centro de la calzada"], "ok": 1, "exp": "Mantenga su vehículo lo más cerca posible del borde derecho y nunca demasiado cerca del eje: el otro puede haberse dormido."}, {"id": "b6-69", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 100", "q": "Hay obras en SU lado de la calzada y viene un vehículo de frente. ¿Quién pasa primero?", "ops": ["Usted, porque llegó antes", "El que viene de frente", "El vehículo más grande", "El vehículo más rápido"], "ok": 1, "exp": "Regla general: el que tiene el obstáculo cede el paso."}, {"id": "b6-70", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 101", "q": "Va a adelantar a 90 km/h y aparece un auto de frente a 350 m, también a 90 km/h. El adelantamiento tarda 8 segundos. Según el libro, ¿qué pasa?", "ops": ["Hay tiempo de sobra: 350 m es mucho", "Habrá un choque: en 8 s ambos recorren 400 m", "Sólo hay riesgo si el otro acelera", "Depende de la potencia del auto"], "ok": 1, "exp": "Siempre piense que el que viene de frente va más rápido de lo que cree, y no cuente con que el adelantado lo ayude: puede acelerar."}, {"id": "b6-71", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 101", "q": "Antes de adelantar mira el espejo y ve que el auto de atrás ya empezó a adelantarlo a usted. ¿Qué hace?", "ops": ["Adelanta igual", "Espera a que termine su maniobra", "Acelera para que no lo pase", "Frena bruscamente"], "ok": 1, "exp": "Tampoco se adelanta si el de adelante señalizó que va a adelantar o a desplazarse a la izquierda."}, {"id": "b6-72", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 102", "q": "Durante un adelantamiento aparece un vehículo de frente y usted no está seguro de lograrlo. ¿Qué hace?", "ops": ["Acelera al máximo para terminar", "Interrumpe el adelantamiento y vuelve atrás", "Pasa por la berma izquierda", "Toca la bocina para que el otro frene"], "ok": 1, "exp": "Ante la duda, no adelante. Y no mire al vehículo que adelanta: tenderá a dirigirse hacia él."}, {"id": "b6-73", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 102", "q": "Terminó de adelantar. ¿Cuándo vuelve a la pista derecha?", "ops": ["Apenas su parachoques pasa el del otro", "Cuando lo ve en el retrovisor interior", "Después de 1 km", "Cuando el otro le hace luces"], "ok": 1, "exp": "Mantenga el señalizador hasta terminar la maniobra y luego apáguelo."}, {"id": "b6-74", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 102", "q": "Un vehículo lo está adelantando. ¿Qué debe hacer usted?", "ops": ["Acelerar para no dejarse pasar", "Mantenerse a la derecha y no acelerar", "Moverse a la izquierda", "Encender las luces altas"], "ok": 1, "exp": "Ayudar a quien adelanta es parte de la solidaridad vial y evita choques frontales."}, {"id": "b6-75", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 103", "q": "¿A qué distancia de un puente, túnel, viaducto o cruce ferroviario está prohibido adelantar traspasando el eje?", "ops": ["50 metros", "100 metros", "200 metros", "500 metros"], "ok": 2, "exp": "Desde 200 m antes y sobre ellos. También al acercarse a cimas, curvas, cruces y pasos peatonales (salvo con semáforo)."}, {"id": "b6-76", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 103", "q": "¿En qué casos se puede adelantar POR LA DERECHA?", "ops": ["Nunca, en ningún caso", "Si el de adelante vira a la izquierda, o con 3+ pistas", "Siempre que haya espacio", "Por la berma, si es necesario"], "ok": 1, "exp": "Sólo esas dos situaciones. Estas maniobras sin invadir la pista contraria se llaman «sobrepaso». Nunca fuera de la calzada."}, {"id": "b6-77", "tema": "Encuentros y adelantamientos", "cap": "6 · pág. 103", "q": "Está detenido en un semáforo en rojo. Un motociclista pasa despacio entre los autos detenidos hasta la línea de detención. ¿Es legal?", "ops": ["No, nunca está permitido", "Sí, si los autos están detenidos", "Sólo los ciclistas, no las motos", "Sólo de noche con poco tránsito"], "ok": 1, "exp": "Sólo cuando los vehículos sobrepasados están detenidos y con precaución."}, {"id": "b6-78", "tema": "Estacionamiento", "cap": "6 · pág. 104", "q": "Estacionando en paralelo junto a la cuneta, ¿a qué distancia máxima de ella y qué separación con otros autos?", "ops": ["1 metro de la cuneta y 10 cm entre autos", "No más de 30 cm de la cuneta y 60 cm entre autos", "Pegado a la cuneta y sin separación", "50 cm de la cuneta y 1 metro entre autos"], "ok": 1, "exp": "Siempre al lado derecho en el sentido del tránsito, salvo señal que permita el izquierdo."}, {"id": "b6-79", "tema": "Estacionamiento", "cap": "6 · pág. 104", "q": "Estaciona en una calle en BAJADA. ¿Hacia dónde deja las ruedas?", "ops": ["Rectas", "Hacia la cuneta", "Hacia el centro de la calzada", "No importa"], "ok": 1, "exp": "En bajada: ruedas hacia la cuneta. En subida: hacia el interior de la calzada. Además: motor apagado, cambio puesto, freno de mano, llave fuera y auto cerrado."}, {"id": "b6-80", "tema": "Estacionamiento", "cap": "6 · pág. 104", "q": "En un camino rural, ¿cómo debe estacionar?", "ops": ["En la pista, con balizas", "Todo el vehículo sobre la berma", "En el centro del camino", "En la berma izquierda"], "ok": 1, "exp": "En caminos públicos de 2 o más pistas por sentido está prohibido estacionar o detenerse en la calzada o la berma."}, {"id": "b6-81", "tema": "Estacionamiento", "cap": "6 · pág. 104", "q": "¿Puede dejar a un niño pequeño o a un perro esperando dentro del auto estacionado?", "ops": ["Sí, con la ventana un poco abierta", "No", "Sí, por pocos minutos", "Sí, si está a la sombra"], "ok": 1, "exp": "El libro lo incluye entre lo que no se debe olvidar al estacionar."}, {"id": "b6-82", "tema": "Estacionamiento", "cap": "6 · pág. 104", "q": "¿Dónde está prohibido estacionar Y también detenerse?", "ops": ["En una calle residencial angosta", "En aceras, doble fila, cruces y ciclovías", "Frente a un supermercado", "En cualquier calle con árboles"], "ok": 1, "exp": "También junto a obras o excavaciones, y en refugios peatonales o bandejones."}, {"id": "b6-83", "tema": "Estacionamiento", "cap": "6 · pág. 105", "q": "¿A qué distancia mínima de un GRIFO (para incendios) puede estacionar?", "ops": ["1 metro", "5 metros", "10 metros", "20 metros"], "ok": 1, "exp": "A menos de 5 m de un grifo está prohibido estacionar."}, {"id": "b6-84", "tema": "Estacionamiento", "cap": "6 · pág. 106", "q": "¿A qué distancia mínima de una ESQUINA puede estacionar?", "ops": ["3 metros", "5 metros", "10 metros", "20 metros"], "ok": 2, "exp": "Menos de 10 m de una esquina, de una señal PARE, Ceda el Paso o de advertencia, o de la entrada de bomberos, postas y hospitales: prohibido."}, {"id": "b6-85", "tema": "Estacionamiento", "cap": "6 · pág. 106", "q": "¿A qué distancia mínima de un paradero de buses o de un cruce ferroviario puede estacionar?", "ops": ["5 metros", "10 metros", "20 metros", "50 metros"], "ok": 2, "exp": "20 m de una parada de locomoción colectiva y 20 m de un cruce ferroviario a nivel. 15 m de recintos militares o policiales. 3 m de puertas de iglesias, colegios, hoteles y espectáculos en horas de afluencia."}, {"id": "b6-86", "tema": "Estacionamiento", "cap": "6 · pág. 106", "q": "Necesita dejar a un pasajero donde está prohibido estacionar (pero no prohibido detenerse). ¿Puede?", "ops": ["No, nunca", "Sí, sólo el tiempo mínimo para subir o bajar", "Sí, hasta 15 minutos", "Sí, con balizas el tiempo que quiera"], "ok": 1, "exp": "Detenerse para subir o bajar pasajeros es distinto de estacionar, salvo donde la señal prohíba también detenerse."}, {"id": "b6-87", "tema": "Estacionamiento", "cap": "6 · pág. 106", "q": "Su auto se avería y debe quedar detenido en un lugar no autorizado. Si baja del vehículo, ¿qué debe usar?", "ops": ["Nada especial si es de día", "Un chaleco amarillo reflectante", "Una linterna encendida", "Ropa oscura para no encandilar"], "ok": 1, "exp": "Instale los dispositivos reflectantes en la calzada y mantenga las luces de advertencia de peligro si es posible. De noche, sin alumbrado, deje encendidas las luces de estacionamiento."}, {"id": "b6-88", "tema": "Estacionamiento", "cap": "6 · pág. 106-107", "q": "Se pasó un poco la línea de detención en un cruce. ¿Puede retroceder?", "ops": ["Sí, si no viene nadie", "No, salvo indicación de Carabineros", "Sí, con las balizas encendidas", "Sí, si es menos de un metro"], "ok": 1, "exp": "Marcha atrás sólo cuando es indispensable: para mantener la libre circulación, incorporarse o estacionar; lentamente y sin confiarse de los espejos."}, {"id": "b6-89", "tema": "Cruces ferroviarios", "cap": "6 · pág. 107", "q": "Un tren a 100 km/h, ¿cuántos metros necesita para detenerse?", "ops": ["Entre 50 y 100 metros", "Unos 200 metros", "Entre 800 y 1.000 metros", "Unos 10 metros"], "ok": 2, "exp": "El tren tiene siempre preferencia y en la práctica nunca puede detenerse a tiempo: la responsabilidad es suya."}, {"id": "b6-90", "tema": "Cruces ferroviarios", "cap": "6 · pág. 107", "q": "Llega a un cruce ferroviario con barreras automáticas. ¿Qué recomienda el libro?", "ops": ["Confiar en las barreras y pasar", "Detenerse, mirar y escuchar", "Cruzar rápido sin detenerse", "Tocar la bocina y pasar"], "ok": 1, "exp": "Los sistemas pueden fallar. Tampoco cruce si no hay espacio suficiente al otro lado de las vías."}, {"id": "b6-91", "tema": "Cruces ferroviarios", "cap": "6 · pág. 107", "q": "Ya empezó a cruzar la vía férrea y se encienden las luces y suena la alarma. ¿Qué hace?", "ops": ["Se detiene sobre la vía", "Termina de cruzar sin detenerse", "Retrocede para salir de la vía", "Apaga el motor y espera"], "ok": 1, "exp": "Detenerse sobre los rieles es lo peor. Siga y despeje el cruce."}, {"id": "b6-92", "tema": "Cruces ferroviarios", "cap": "6 · pág. 107", "q": "Su vehículo se descompone sobre un cruce ferroviario. ¿Qué es lo PRIMERO?", "ops": ["Intentar arrancar el motor varias veces", "Hacer salir a todos del vehículo", "Llamar a la grúa y esperar dentro", "Poner los triángulos"], "ok": 1, "exp": "Las vidas primero: todos fuera del vehículo y lejos de las vías."}, {"id": "b7-01", "tema": "Noche y luces", "cap": "7 · pág. 109", "q": "De noche, con niebla o lluvia, ¿cómo percibe la distancia del tránsito que viene de frente?", "ops": ["Más cerca de lo que realmente está", "Más lejos de lo que realmente está", "Exactamente a la distancia real", "Más cerca sólo si trae luces altas"], "ok": 1, "exp": "Sin colores ni contornos claros, el cerebro calcula mal: el que viene de frente está más cerca de lo que parece. Peligroso al adelantar."}, {"id": "b7-02", "tema": "Noche y luces", "cap": "7 · pág. 110", "q": "De noche con luces BAJAS, ¿a qué distancia aproximada ve a un peatón con ropa OSCURA?", "ops": ["Unos 25 metros", "Unos 125 metros", "Unos 300 metros", "Unos 450 metros"], "ok": 0, "exp": "Con luces bajas: ropa oscura 25 m, clara 60 m, con reflectante 125 m. Con luces altas: 150, 300 y 450 m."}, {"id": "b7-03", "tema": "Noche y luces", "cap": "7 · pág. 110", "q": "¿Desde cuándo y hasta cuándo es obligatorio circular con las luces encendidas?", "ops": ["Desde la puesta de sol hasta el amanecer", "Desde ½ h después de la puesta hasta ½ h antes de la salida", "Sólo entre medianoche y las 6 de la mañana", "Sólo cuando llueve o hay neblina"], "ok": 1, "exp": "En ese horario: luces bajas en vías urbanas y luces altas en caminos rurales (bajándolas al cruzarse con otros). Se recomienda luces bajas también de día."}, {"id": "b7-04", "tema": "Noche y luces", "cap": "7 · pág. 110", "q": "Circula de DÍA, con buen tiempo, por una vía interurbana (carretera). ¿Debe llevar luces encendidas?", "ops": ["No: de día con buen tiempo no hace falta", "Sí: en vías interurbanas siempre con luces encendidas", "Sólo en invierno, por la poca luz", "Sólo las luces de estacionamiento"], "ok": 1, "exp": "En vías interurbanas, siempre luces encendidas, aunque no esté oscuro. Y nunca se circula sólo con las luces de estacionamiento."}, {"id": "b7-05", "tema": "Noche y luces", "cap": "7 · pág. 111", "q": "De noche, en carretera, se cruza con un CICLISTA que viene de frente. ¿Debe bajar las luces altas?", "ops": ["No, sólo se bajan ante automóviles", "Sí, ante todo vehículo, también ciclistas", "Sólo si el ciclista le hace señas", "No: de noche en carretera siempre altas"], "ok": 1, "exp": "Baje con anticipación pero no demasiado pronto: el espacio entre ambos debe quedar iluminado. Mire hacia el borde derecho."}, {"id": "b7-06", "tema": "Noche y luces", "cap": "7 · pág. 111", "q": "De noche alcanza a otro vehículo que va delante en la carretera. ¿Qué luces usa?", "ops": ["Luces altas para que el otro lo note", "Luces bajas para no encandilarlo por el espejo", "Sólo las luces de estacionamiento", "Luces neblineras delanteras"], "ok": 1, "exp": "Al adelantar, vuelva a luces altas en cuanto esté seguro de no encandilar al de adelante."}, {"id": "b7-07", "tema": "Noche y luces", "cap": "7 · pág. 113", "q": "Ve de noche luces AMARILLAS en ambos extremos de la parte superior delantera de un vehículo. ¿Qué tipo de vehículo es probablemente?", "ops": ["Una motocicleta con luces adicionales", "Un vehículo de carga o de transporte colectivo", "Una bicicleta con reflectantes", "Un vehículo de emergencia"], "ok": 1, "exp": "Camiones y buses llevan luces amarillas arriba adelante y rojas arriba atrás. Hacia adelante las luces son blancas o amarillas; hacia atrás, rojas (salvo retroceso, blancas)."}, {"id": "b7-08", "tema": "Noche y luces", "cap": "7 · pág. 113", "q": "Conduce de noche en la ciudad, por calles con alumbrado público. ¿Qué luces usa?", "ops": ["Luces altas para ver mejor a los peatones", "Luces bajas", "Sólo las de estacionamiento", "Luces neblineras"], "ok": 1, "exp": "Y ponga especial atención: peatones, ciclistas y niños no siempre son visibles a tiempo."}, {"id": "b7-09", "tema": "Carga y remolque", "cap": "7 · pág. 113", "q": "Lleva una carga PESADA atrás en su vehículo. ¿Qué efecto tiene?", "ops": ["Frena en menos distancia por el peso extra", "El volante se aliviana y el auto tiende a girar más", "Ninguno, si la carga va bien amarrada", "El auto gira menos de lo esperado"], "ok": 1, "exp": "Con carga pesada: acelera más lento, frena en más distancia, se inclina más en curvas y necesita más espacio para adelantar."}, {"id": "b7-10", "tema": "Carga y remolque", "cap": "7 · pág. 114", "q": "¿Dónde NO debe llevar objetos duros o pesados dentro del auto?", "ops": ["En el maletero, bien sujetos", "En la bandeja trasera, bajo la luneta", "En el piso del asiento trasero", "En la guantera"], "ok": 1, "exp": "Tampoco tape la visión de las esquinas traseras ni del espejo retrovisor. Sujete bien la carga para que no se desplace."}, {"id": "b7-11", "tema": "Carga y remolque", "cap": "7 · pág. 114", "q": "Con licencia Clase B, ¿qué remolque puede arrastrar?", "ops": ["Cualquier remolque, si tiene luces", "Uno de peso ≤ tara del auto, total ≤ 3.500 kg", "Sólo remolques de menos de 100 kg", "Ninguno: se requiere licencia profesional"], "ok": 1, "exp": "Además, los remolques con capacidad de carga sobre 750 kg deben tener frenos (los de empuje son los más comunes) y freno de emergencia automático."}, {"id": "b7-12", "tema": "Carga y remolque", "cap": "7 · pág. 115", "q": "Su remolque empieza a zigzaguear en la carretera. ¿Qué hace?", "ops": ["Frena a fondo de inmediato", "Suelta el acelerador poco a poco hasta estabilizarse", "Acelera fuerte para enderezar el remolque", "Mueve el volante de lado a lado"], "ok": 1, "exp": "Antes de partir revise: carga bien distribuida, presión correcta sobre la bola de enganche, luces conectadas, espejos ajustados y freno del remolque suelto."}, {"id": "b7-13", "tema": "Carga y remolque", "cap": "7 · pág. 115", "q": "La presión del remolque sobre la bola de enganche es baja o nula. ¿Qué puede pasar?", "ops": ["Nada: así el auto va más liviano", "El conjunto puede serpentear y el remolque volcar", "El auto frena en menos distancia", "Las luces bajas encandilan a los de enfrente"], "ok": 1, "exp": "Si la presión es demasiado grande, en cambio, se hunde la parte trasera y las luces bajas encandilan a los que vienen de frente. Siga las indicaciones del fabricante."}, {"id": "b7-14", "tema": "Autopistas y túneles", "cap": "7 · pág. 116", "q": "Entra a una autopista por la pista de aceleración. ¿Quién tiene prioridad?", "ops": ["Usted, porque viene acelerando", "Los que ya circulan por la autopista", "El vehículo más rápido", "El que toque la bocina primero"], "ok": 1, "exp": "Adapte la velocidad en la pista de aceleración, mire espejos y gire la cabeza antes de incorporarse. Luego quédese un tiempo en la pista derecha."}, {"id": "b7-15", "tema": "Autopistas y túneles", "cap": "7 · pág. 116", "q": "Usa una autopista urbana con cobro electrónico sin tener TAG (Televía) ni otro medio de pago. ¿Qué pasa?", "ops": ["Nada: es gratis si no tiene TAG", "Es sancionado", "Paga en efectivo en la salida", "Sólo paga los días laborales"], "ok": 1, "exp": "Averigüe con las concesionarias las formas de pago antes de usar la autopista."}, {"id": "b7-16", "tema": "Autopistas y túneles", "cap": "7 · pág. 117", "q": "¿Puede detenerse en la berma de una autopista para dejar bajar a un pasajero?", "ops": ["Sí, con las balizas encendidas", "No: sólo por emergencia o si lo pide Carabineros", "Sí, si es menos de un minuto", "Sí, en los accesos a la autopista"], "ok": 1, "exp": "Tampoco se camina por la autopista, salvo emergencia."}, {"id": "b7-17", "tema": "Autopistas y túneles", "cap": "7 · pág. 117", "q": "Su auto falla en la autopista y logra llegar a la berma. ¿Por qué puerta deben salir usted y sus pasajeros?", "ops": ["Por la puerta izquierda", "Por la derecha, y esperar lejos del tránsito", "Por la que esté más cerca de cada uno", "Nadie debe bajar nunca del vehículo"], "ok": 1, "exp": "Deténgase lo más lejos posible de la calzada, idealmente cerca de un teléfono SOS, encienda balizas y vigile a los niños."}, {"id": "b7-18", "tema": "Autopistas y túneles", "cap": "7 · pág. 118", "q": "Su auto queda detenido EN una pista de la autopista y no puede llegar a la berma. ¿Qué NO debe hacer?", "ops": ["Encender las balizas", "Quedarse con el cinturón puesto si es peligroso salir", "Colocar el triángulo en la calzada o intentar reparar algo", "Llamar a emergencias"], "ok": 2, "exp": "En la calzada de una autopista no intente poner triángulos ni reparar: el riesgo de ser atropellado es enorme. Salga sólo si no es riesgoso, con chaleco."}, {"id": "b7-19", "tema": "Autopistas y túneles", "cap": "7 · pág. 118", "q": "Sale de la autopista y el velocímetro marca 80 km/h, pero siente que va «lento». ¿Por qué?", "ops": ["Porque el velocímetro marca de más", "Porque se acostumbró a ir rápido", "Porque la salida es en bajada", "Porque el auto ya está frenando"], "ok": 1, "exp": "Muchas salidas tienen curvas pronunciadas. La pista de desaceleración se reconoce por líneas segmentadas más anchas, con señales a 300, 200 y 100 m."}, {"id": "b7-20", "tema": "Autopistas y túneles", "cap": "7 · pág. 119", "q": "Al entrar a un túnel bien iluminado, ¿qué debe hacer?", "ops": ["Nada, porque el túnel ya está iluminado", "Encender luces antes y quitarse los lentes de sol", "Tocar la bocina para avisar que entra", "Acelerar para salir lo antes posible"], "ok": 1, "exp": "Encienda las luces antes de entrar para que no confundan sus luces traseras con las de freno. Asegúrese de tener combustible suficiente."}, {"id": "b7-21", "tema": "Autopistas y túneles", "cap": "7 · pág. 119", "q": "Su auto se descompone dentro de un túnel. ¿Cómo debe pedir ayuda?", "ops": ["Con el celular, llamando al 133", "Sólo desde un teléfono SOS del túnel", "Tocando la bocina repetidamente", "Caminando hacia la salida a buscar ayuda"], "ok": 1, "exp": "Si no puede mover el auto, quédese dentro con todos los cinturones puestos y espere asistencia. Si hay atochamiento, balizas y motor apagado si está detenido."}, {"id": "b7-22", "tema": "Autopistas y túneles", "cap": "7 · pág. 119", "q": "Su auto se incendia dentro de un túnel y no puede sacarlo. ¿Qué hace?", "ops": ["Se queda dentro esperando a bomberos", "Se orilla, apaga el motor y abandona el vehículo", "Sigue manejando hasta salir del túnel", "Abre el capó para ver de dónde sale el fuego"], "ok": 1, "exp": "Si puede, salga del túnel. Si no logra apagar el fuego, pida ayuda desde un teléfono de emergencia."}, {"id": "b7-23", "tema": "Autopistas y túneles", "cap": "7 · pág. 120", "q": "Sobrepasa a un motociclista. ¿Qué distancia lateral deja?", "ops": ["Menos que a un auto, porque es pequeño", "La misma que dejaría a un automóvil", "Ninguna", "50 cm"], "ok": 1, "exp": "Un motociclista necesita una pista completa de seguridad, como un auto."}, {"id": "b7-24", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 120", "q": "¿Cuándo es más peligrosa la lluvia sobre el pavimento?", "ops": ["Después de varias horas lloviendo", "Con las primeras gotas tras un período seco", "Nunca: el agua limpia el pavimento", "Sólo de noche, con poca visibilidad"], "ok": 1, "exp": "Disminuya la velocidad ante las primeras señales de agua."}, {"id": "b7-25", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 121", "q": "Con el pavimento mojado, ¿cuánto aumenta su distancia de frenado?", "ops": ["No aumenta con buenos neumáticos", "Al menos el doble", "Un 10 % más", "Se reduce a la mitad"], "ok": 1, "exp": "Aumente la distancia con el de adelante y frene suave y progresivamente. Sin ABS, si patina, suelte el freno para recuperar tracción."}, {"id": "b7-26", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 121", "q": "¿Cuál es el mejor consejo para EVITAR el aquaplaning?", "ops": ["Inflar más los neumáticos", "Moderar la velocidad", "Ir por el centro de la calzada", "Usar luces altas"], "ok": 1, "exp": "A mayor velocidad, más agua deben desalojar los surcos. En aquaplaning el auto no obedece ni a la dirección ni a los frenos."}, {"id": "b7-27", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 122", "q": "No tiene alternativa y debe cruzar un tramo inundado. ¿Cómo lo hace?", "ops": ["Rápido, para no quedarse atascado", "Lento, en primera, y luego secar los frenos", "En neutro, dejando rodar el auto", "En reversa"], "ok": 1, "exp": "Después de pasar el agua, compruebe la eficacia de los frenos antes de recuperar velocidad."}, {"id": "b7-28", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 123", "q": "Conduce sobre nieve. ¿Dónde deben ponerse las cadenas, como mínimo?", "ops": ["En las ruedas delanteras siempre", "En las ruedas motrices (las de tracción)", "Sólo en las traseras", "En la rueda de repuesto"], "ok": 1, "exp": "Con nieve: todo suave (frenos, acelerador, embrague, dirección), más distancia, seguir las huellas de otros y evitar adelantar."}, {"id": "b7-29", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 123", "q": "Sube una cuesta con nieve. ¿Qué marcha recomienda el libro?", "ops": ["Primera, con el motor bien revolucionado", "La marcha más alta posible, a velocidad sostenida", "Neutro, para no forzar el motor", "Cambiando seguido de marcha según la pendiente"], "ok": 1, "exp": "Una marcha alta reduce el riesgo de que las ruedas motrices patinen. En bajada, al revés: marcha baja, lento, frenando con el motor."}, {"id": "b7-30", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 124", "q": "Está nevando y es de noche. ¿Conviene usar luces altas?", "ops": ["Sí, para ver mejor la ruta", "No: rebotan y lo encandilan", "Sí, sólo en las curvas", "Da lo mismo cuáles use"], "ok": 1, "exp": "Agregue anticongelante al líquido lavaparabrisas y deténgase a limpiar la nieve de vidrios y luces cuando haga falta."}, {"id": "b7-31", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 124", "q": "En un día frío y húmedo, ¿dónde es más probable encontrar hielo en el camino?", "ops": ["En las rectas soleadas", "Bajo los árboles y sobre los puentes", "En el centro de las ciudades", "En las subidas pronunciadas"], "ok": 1, "exp": "Las sombras son las primeras en congelarse y las últimas en secarse; los puentes se congelan antes que el resto. Si la dirección se siente muy liviana, es una señal."}, {"id": "b7-32", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 124", "q": "Con la calzada helada, ¿cuánto puede aumentar la distancia de frenado?", "ops": ["El doble", "Hasta 10 veces más", "No cambia con cadenas", "3 veces más"], "ok": 1, "exp": "Por eso: mucha más distancia, menos velocidad, soltar el acelerador y evitar frenar."}, {"id": "b7-33", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 125", "q": "Hay niebla espesa. ¿Cuándo usar la luz de niebla TRASERA?", "ops": ["Siempre de noche en carretera", "Sólo con niebla espesa", "Nunca: está prohibida en Chile", "En la ciudad cuando llueve"], "ok": 1, "exp": "En niebla: luces bajas (+ neblineros delanteros si tiene), nunca altas. Más distancia, menos velocidad, guiarse por las demarcaciones y no adelantar."}, {"id": "b7-34", "tema": "Clima: lluvia, nieve, hielo, niebla", "cap": "7 · pág. 125", "q": "En un camino de montaña sopla un fuerte viento lateral. ¿Qué hace?", "ops": ["Acelera para pasar rápido la zona", "Reduce la velocidad y corrige girando contra el viento", "Suelta un poco el volante para que el auto se acomode", "Circula por el centro de la calzada"], "ok": 1, "exp": "El viento puede sacar del camino o volcar el vehículo. Cuidado al adelantar ciclistas o motos: el viento los desvía."}, {"id": "b8-01", "tema": "Conducción eficiente", "cap": "8 · pág. 127", "q": "Según la Agencia Chilena de Eficiencia Energética, ¿cuánto combustible se puede ahorrar con técnicas de conducción eficiente?", "ops": ["Entre 1 y 2 %", "Entre 10 y 15 %", "Alrededor de 50 %", "Nada significativo"], "ok": 1, "exp": "Además baja el costo de mantenimiento y las emisiones de CO₂."}, {"id": "b8-02", "tema": "Conducción eficiente", "cap": "8 · pág. 129", "q": "Lleva un portaequipajes o bultos en el techo en carretera. ¿Cuánto puede aumentar el consumo?", "ops": ["Nada, si va bien amarrado", "Más de un 20 %", "Alrededor de 1 %", "Exactamente 5 %"], "ok": 1, "exp": "Por la resistencia del aire. Quite el portaequipajes y la carga pesada que no use."}, {"id": "b8-03", "tema": "Conducción eficiente", "cap": "8 · pág. 129", "q": "¿Cada cuánto recomienda el libro revisar la presión de los neumáticos?", "ops": ["Una vez al año", "Al menos cada dos semanas", "Sólo en la revisión técnica", "Sólo cuando se ve bajo"], "ok": 1, "exp": "Sólo 5 PSI menos de lo óptimo puede aumentar el consumo un 3 %."}, {"id": "b8-04", "tema": "Conducción eficiente", "cap": "8 · pág. 130", "q": "Al encender el motor de un auto moderno, ¿conviene pisar el acelerador?", "ops": ["Sí, para que arranque mejor", "No: sólo aumenta el consumo", "Sí, tres veces antes de dar contacto", "Sólo en invierno"], "ok": 1, "exp": "Acelere suave después: las aceleraciones a fondo disparan el consumo."}, {"id": "b8-05", "tema": "Conducción eficiente", "cap": "8 · pág. 131", "q": "Va a 70 km/h y puede ir en 4.ª o en 5.ª. ¿Cuál es más eficiente?", "ops": ["4.ª", "5.ª", "3.ª", "Neutro"], "ok": 1, "exp": "Las marchas altas hacen trabajar al motor a menos RPM y consumen menos."}, {"id": "b8-06", "tema": "Conducción eficiente", "cap": "8 · pág. 132", "q": "Ve un semáforo en rojo adelante. ¿Cómo reduce la velocidad de forma eficiente?", "ops": ["Poniendo neutro y dejando rodar", "Soltando el acelerador sin sacar la marcha", "Frenando fuerte al final", "Apagando el motor al acercarse"], "ok": 1, "exp": "Con el cambio puesto y sin acelerar se corta la inyección de combustible y además frena con el motor."}, {"id": "b8-07", "tema": "Conducción eficiente", "cap": "8 · pág. 133", "q": "Queda detenido por un banderero en obras durante varios minutos. ¿Conviene apagar el motor?", "ops": ["No, nunca conviene apagarlo", "Sí: si se detiene más de un minuto", "Sólo si hace calor", "Sólo en autos eléctricos"], "ok": 1, "exp": "Regla general: más de 1 minuto detenido → apagar el motor."}, {"id": "b8-08", "tema": "Conducción eficiente", "cap": "8 · pág. 133", "q": "Al adelantar o en una emergencia, ¿qué prima: la economía o la seguridad?", "ops": ["La economía", "La seguridad", "Ninguna en especial", "Depende del precio del combustible"], "ok": 1, "exp": "Una conducción segura es la base de una conducción eficiente, no al revés."}, {"id": "b8-09", "tema": "Conducción eficiente", "cap": "8 · pág. 131", "q": "En un viaje de menos de 100 km, ¿qué dice el libro sobre ir a la velocidad máxima?", "ops": ["Que ahorra mucho tiempo", "Que gana poco tiempo y gasta bastante más", "Que gasta menos combustible", "Que es obligatorio en carretera"], "ok": 1, "exp": "¿Vale la pena gastar mucho más combustible por unos pocos minutos?"}, {"id": "b9-01", "tema": "Siniestros y primeros auxilios", "cap": "9 · pág. 136", "q": "Participa en un siniestro con personas lesionadas, pero usted no tuvo la culpa. ¿Qué obligaciones tiene?", "ops": ["Ninguna, si no fue su culpa", "Detenerse, ayudar y dar cuenta a la policía", "Sólo dejar su número de teléfono", "Irse y avisar después a su seguro"], "ok": 1, "exp": "Con culpa o sin ella. Darse a la fuga es delito: puede significar inhabilidad de por vida para conducir y cárcel efectiva de al menos un año."}, {"id": "b9-02", "tema": "Siniestros y primeros auxilios", "cap": "9 · pág. 136", "q": "Llega a un siniestro donde está involucrado un vehículo con la calcomanía «Vehículo Eléctrico». ¿Qué NO debe hacer?", "ops": ["Encender sus balizas", "Llamar a emergencias", "Tocar los cables naranjos", "Mantener la calma"], "ok": 2, "exp": "Los cables naranjos son de alto voltaje. Si los vehículos son a combustión, apague sus motores; nadie debe fumar."}, {"id": "b9-03", "tema": "Siniestros y primeros auxilios", "cap": "9 · pág. 136", "q": "¿Qué números de emergencia debe conocer?", "ops": ["SAMU 131, Bomberos 132, Carabineros 133", "Carabineros 131, SAMU 133, Bomberos 132", "Todos al 911", "SAMU 132, Bomberos 133, Carabineros 131"], "ok": 0, "exp": "131 ambulancia (SAMU), 132 Bomberos, 133 Carabineros. Indique el lugar exacto, la cantidad de vehículos y de víctimas."}, {"id": "b9-04", "tema": "Siniestros y primeros auxilios", "cap": "9 · pág. 137", "q": "Un motociclista herido está consciente en el suelo con su casco puesto. ¿Qué hace?", "ops": ["Le saca el casco para que respire mejor", "No le quita el casco", "Lo sienta para revisarlo", "Le da agua"], "ok": 1, "exp": "No mueva a los heridos salvo peligro inminente (incendio, explosión, atropello). No les dé de comer ni de beber, abríguelos y no los abandone."}, {"id": "b9-05", "tema": "Siniestros y primeros auxilios", "cap": "9 · pág. 137", "q": "En la secuencia de primeros auxilios XABCDE, ¿qué significa la «X», lo primero que se atiende?", "ops": ["Examinar la ropa de la víctima", "Control de hemorragias graves", "Exponer las heridas al aire", "Extraer al herido del vehículo"], "ok": 1, "exp": "X: hemorragias graves. A: abrir vía aérea (frente-mentón). B: buena ventilación. C: circulación. D: déficit de conciencia (AVDI). E: exposición/abrigo."}, {"id": "b9-06", "tema": "Siniestros y primeros auxilios", "cap": "9 · pág. 137", "q": "Una persona herida no responde. ¿Qué maniobra recomienda el libro para abrir la vía aérea?", "ops": ["Golpearle la espalda", "La maniobra frente-mentón", "Darle agua", "Sentarla"], "ok": 1, "exp": "Si no responde, la lengua puede caer hacia atrás y tapar el paso del aire."}, {"id": "b9-07", "tema": "Siniestros y primeros auxilios", "cap": "9 · pág. 138", "q": "Hay un siniestro con un camión con rótulos de carga peligrosa (inflamable, corrosiva…). ¿Dónde se ubica usted?", "ops": ["Junto al camión para ayudar", "Lejos y con el viento a su favor", "Detrás del camión, protegido", "Donde haya sombra"], "ok": 1, "exp": "Anote el material peligroso (rótulo) antes de llamar a emergencias y ayude a advertir el peligro."}, {"id": "b9-08", "tema": "Documentos y vehículo", "cap": "9 · pág. 139", "q": "¿Sin cuáles documentos o elementos un vehículo puede ser retirado de circulación por Carabineros o Inspectores?", "ops": ["Sin el manual del vehículo", "Sin patente, permiso o SOAP", "Sin rueda de repuesto", "Sin limpiaparabrisas"], "ok": 1, "exp": "También debe portarse el certificado de revisión técnica (o de homologación) vigente."}, {"id": "b9-09", "tema": "Documentos y vehículo", "cap": "9 · pág. 139", "q": "¿Qué cubre el SOAP (Seguro Obligatorio de Accidentes Personales)?", "ops": ["Los daños materiales a los vehículos", "Muerte y lesiones de cualquier persona", "Sólo al conductor que no tuvo la culpa", "El robo o incendio del vehículo"], "ok": 1, "exp": "Se contrata cada año y se acredita al pagar el permiso de circulación."}, {"id": "b9-10", "tema": "Documentos y vehículo", "cap": "9 · pág. 139", "q": "¿Qué es el permiso de circulación y qué se necesita para obtenerlo?", "ops": ["Un examen de manejo anual", "Un impuesto anual a la Municipalidad", "Un seguro privado contra choques", "Un trámite anual en Carabineros"], "ok": 1, "exp": "Los automóviles particulares y motos lo pagan en marzo."}, {"id": "b9-11", "tema": "Documentos y vehículo", "cap": "9 · pág. 140", "q": "Su patente termina en 5. ¿En qué mes le corresponde la revisión técnica (o el mes anterior)?", "ops": ["Enero", "Mayo", "Agosto", "Diciembre"], "ok": 2, "exp": "Calendario: 9 enero, 0 febrero, 1 abril, 2 mayo, 3 junio, 4 julio, 5 agosto, 6 septiembre, 7 octubre, 8 noviembre. Verificar en www.prt.cl."}, {"id": "b9-12", "tema": "Documentos y vehículo", "cap": "9 · pág. 141", "q": "Carabineros le retuvo la licencia. ¿Qué puede mostrar en su reemplazo para conducir?", "ops": ["Una fotocopia de la licencia", "Un permiso provisional o la citación", "Su cédula de identidad", "Nada: no puede conducir"], "ok": 1, "exp": "Siempre debe portar la licencia de conducir o, si fue retenida, esos documentos."}, {"id": "b9-13", "tema": "Uso del teléfono", "cap": "9 · pág. 141", "q": "Según la Ley No Chat, ¿cuál de estos SÍ es un sistema de «manos libres» permitido?", "ops": ["El teléfono sujeto entre el hombro y la cabeza", "El teléfono apoyado en las piernas", "Un sistema que deja ambas manos en el volante", "Un soporte a la altura del oído"], "ok": 2, "exp": "No son «manos libres»: soportes a la altura del oído, sostenerlo con el hombro, cabeza, piernas o muñeca, ni nada que obligue a manipularlo con las manos."}, {"id": "b9-14", "tema": "Uso del teléfono", "cap": "9 · pág. 141", "q": "Va en bicicleta. ¿Le aplica la Ley No Chat?", "ops": ["No, sólo a vehículos motorizados", "Sí: incluye a los ciclos", "Sólo cuando circulan por ciclovías", "Sólo de noche"], "ok": 1, "exp": "La prohibición de manipular dispositivos al conducir rige para todo vehículo, incluidos los ciclos."}, {"id": "b9-15", "tema": "Uso del teléfono", "cap": "9 · pág. 141", "q": "Recibe una llamada importante mientras conduce y no tiene manos libres. ¿Qué hace?", "ops": ["Contesta rápido y cuelga", "Busca un lugar seguro, se detiene y contesta", "Contesta en altavoz con el teléfono en la mano", "Contesta en el próximo semáforo en rojo"], "ok": 1, "exp": "Manipular el teléfono, incluso en luz roja, en un taco o en un PARE, es infracción gravísima."}, {"id": "b9-16", "tema": "Uso del teléfono", "cap": "9 · pág. 141", "q": "Quiere usar Waze o Google Maps en el viaje. ¿Cuándo debe programar la ruta?", "ops": ["Mientras conduce, en una recta", "Antes de partir, estacionado", "En los semáforos en rojo", "No se pueden usar al conducir"], "ok": 1, "exp": "Así lo establece la Ley No Chat."}, {"id": "b9-17", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 142", "q": "Una persona de 17 años obtuvo su licencia Clase B. ¿Cómo debe conducir hasta cumplir 18?", "ops": ["Sola, pero sólo de día", "Con alguien con licencia de 5+ años al lado", "Sólo por carretera, nunca en ciudad", "Con cualquier acompañante mayor de edad"], "ok": 1, "exp": "Además, para obtenerla a los 17 necesita autorización de padres o representantes y haber aprobado un curso en una Escuela de Conductores."}, {"id": "b9-18", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 142", "q": "Su licencia tiene la restricción «uso de lentes». Hoy olvidó sus lentes. ¿Puede conducir?", "ops": ["Sí, si ve bien", "No", "Sí, de día", "Sí, en trayectos cortos"], "ok": 1, "exp": "La Dirección de Tránsito puede restringir horario, zona, vehículo adaptado, lentes, audífono, etc."}, {"id": "b9-19", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 142", "doble": true, "q": "¿Por cuánto tiempo se suspende la licencia la primera vez que se conduce BAJO LA INFLUENCIA del alcohol (sin daños)?", "ops": ["1 semana", "3 meses", "2 años", "De por vida"], "ok": 1, "exp": "Bajo la influencia: 3 meses. Estado de ebriedad o bajo drogas: 2 años. Los plazos aumentan con reincidencia o si hay lesionados o fallecidos."}, {"id": "b9-20", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 142", "doble": true, "q": "¿Qué suspensión de licencia corresponde por exceder en MÁS DE 60 km/h el límite de velocidad?", "ops": ["5 días", "6 meses", "3 meses", "No hay suspensión"], "ok": 1, "exp": "Más de 60 km/h sobre el límite: 6 meses. Más de 20 km/h: entre 5 y 45 días (igual que pasar una luz roja o un PARE)."}, {"id": "b9-21", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 143", "q": "¿Qué pasa si acumula dos infracciones graves o gravísimas en 12 meses?", "ops": ["Nada", "Se suspende su licencia", "Le regalan un curso", "Sólo paga las multas"], "ok": 1, "exp": "La acumulación de dos infracciones gravísimas o graves en doce meses suspende la licencia."}, {"id": "b9-22", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 143", "doble": true, "q": "Exceder el límite de velocidad entre 20 y 60 km/h, ¿qué tipo de infracción es?", "ops": ["Leve", "Menos grave", "Grave", "Gravísima"], "ok": 3, "exp": "Hasta 10 km/h: menos grave. De 11 a 20 km/h: grave. Entre 20 y 60 km/h: gravísima."}, {"id": "b9-23", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 143", "q": "¿Cuál de estas es una infracción GRAVÍSIMA?", "ops": ["No señalizar antes de virar", "Conducir con la patente oculta o ilegible", "Estacionar en lugar prohibido", "No renovar la licencia a tiempo"], "ok": 1, "exp": "Gravísimas: luz roja o PARE, conducir sin licencia, menores de 12 adelante, sin SRI, manipular el celular, sin patente o patente oculta, exceso de 20 a 60 km/h."}, {"id": "b9-24", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 143", "q": "Conducir sin cinturón (o sin que los pasajeros lo usen debiendo hacerlo), ¿qué tipo de infracción es?", "ops": ["Leve", "Menos grave", "Grave", "No es infracción"], "ok": 2, "exp": "Es grave. También son graves: adelantar en lugares prohibidos, conducir en contra del tránsito, no respetar la preferencia de paso, neumáticos en mal estado, no bajar las luces en carretera."}, {"id": "b9-25", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 144", "q": "No señalizar antes de virar, ¿qué tipo de infracción es?", "ops": ["Gravísima", "Grave", "Menos grave", "No es infracción"], "ok": 2, "exp": "Menos graves, por ejemplo: no señalizar, virar en U donde está prohibido, marcha atrás indebida, exceder hasta 10 km/h, no renovar la licencia a tiempo."}, {"id": "b9-26", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 145", "q": "¿Cuál de estas conductas es un DELITO que puede llevar a prisión?", "ops": ["Estacionar en doble fila", "Conducir con licencia falsa", "Olvidar la revisión técnica", "No usar el intermitente"], "ok": 1, "exp": "También: presentar certificados falsos para obtener la licencia, o conducir ebrio o bajo efecto de drogas."}, {"id": "b9-27", "tema": "Frenadas y emergencias", "cap": "9 · pág. 145", "q": "Frenada fuerte en un auto con ABS: el pedal vibra. ¿Qué hace?", "ops": ["Suelta el freno: algo anda mal", "Mantiene la máxima presión", "Bombea el pedal rápidamente", "Tira el freno de mano"], "ok": 1, "exp": "En ambos casos (con o sin ABS), pisar el embrague antes de detenerse por completo evita que el motor se apague."}, {"id": "b9-28", "tema": "Frenadas y emergencias", "cap": "9 · pág. 145", "q": "Frenada fuerte en un auto SIN ABS. ¿Cómo frena según el libro?", "ops": ["Suave y constante todo el tiempo", "Fuerte, aflojando si se bloquean", "A fondo sin soltar aunque se bloqueen", "Sólo con el freno de mano"], "ok": 1, "exp": "Lo mejor: evitar frenadas fuertes manteniendo distancia y actitud preventiva."}, {"id": "b9-29", "tema": "Frenadas y emergencias", "cap": "9 · pág. 146", "q": "Pisa el freno y el pedal se va al fondo sin resistencia (falla total). ¿Qué es lo PRIMERO que recomienda el libro?", "ops": ["Apagar el motor", "Presionar y soltar el pedal varias veces", "Tirar fuerte del freno de mano", "Poner neutro"], "ok": 1, "exp": "Luego: bajar marchas (freno motor), freno de mano suave y progresivo, avisar con balizas/bocina, buscar una pista de emergencia y, en último caso, rozar contra un talud o defensa."}, {"id": "b9-30", "tema": "Frenadas y emergencias", "cap": "9 · pág. 146", "q": "Con falla total de frenos, ¿por qué NO debe apagar el motor?", "ops": ["Porque gasta la batería", "Perdería la dirección asistida", "Porque es ilegal hacerlo", "Porque se enfría el motor"], "ok": 1, "exp": "Mantenga el motor encendido y sujete el volante firmemente."}, {"id": "b9-31", "tema": "El vehículo", "cap": "9 · pág. 147", "q": "Su auto bota humo AZUL por el escape. ¿Qué indica?", "ops": ["Fuga de refrigerante", "Consumo anormal de aceite", "Motor frío", "Exceso de aire en la mezcla"], "ok": 1, "exp": "Humo negro: falla en la combustión (filtro de aire, exceso de inyección, inyectores). Humo blanco con motor caliente: fuga de refrigerante hacia el motor (con motor frío puede ser sólo condensación)."}, {"id": "b9-32", "tema": "El vehículo", "cap": "9 · pág. 147", "q": "¿Qué recomienda el libro para contaminar menos al conducir?", "ops": ["Dejar el motor en ralentí para calentarlo", "Acelerar suave, dejar rodar y evitar el ralentí", "Acelerar fuerte para llegar antes", "Usar siempre marchas bajas"], "ok": 1, "exp": "Las altas velocidades y las aceleraciones bruscas aumentan las emisiones y el consumo."}, {"id": "b9-33", "tema": "El vehículo", "cap": "9 · pág. 148", "q": "Va a hacer un viaje largo en un auto eléctrico. ¿Qué recomienda el libro?", "ops": ["Nada especial", "Revisar autonomía y llevar el cable", "Ir siempre a máxima velocidad", "Desconectar la batería en cada parada"], "ok": 1, "exp": "El vehículo debe tener la etiqueta «Vehículo Eléctrico» o «Vehículo Híbrido». Al cargar, ubique bien el cable para que nadie lo pise."}, {"id": "b9-34", "tema": "Licencia, sanciones y trámites", "cap": "Anexo 3 · pág. 168", "q": "¿Dónde debe obtener su licencia de conducir?", "ops": ["En cualquier municipalidad del país", "En la municipalidad de la comuna donde reside", "En Carabineros", "En el Registro Civil"], "ok": 1, "exp": "No todas las municipalidades otorgan licencias: consulte horarios, modalidad y documentos para acreditar residencia y escolaridad."}, {"id": "b9-35", "tema": "Licencia, sanciones y trámites", "cap": "Anexo 3 · pág. 169", "q": "Reprobó el examen teórico. ¿Qué plazo tiene para repetirlo dentro del mismo proceso?", "ops": ["Las veces que quiera", "Una vez, en máximo 25 días hábiles", "Debe esperar 6 meses", "Sólo al día siguiente"], "ok": 1, "exp": "Si no se presenta o vuelve a reprobar, se deniega la licencia. Tras la primera denegación, espera 30 días hábiles; tras la segunda, 6 meses cada vez."}, {"id": "b9-36", "tema": "Licencia, sanciones y trámites", "cap": "Anexo 3 · pág. 169", "q": "¿Qué exámenes se rinden en la municipalidad para obtener la licencia?", "ops": ["Sólo el examen teórico", "Médicos, teórico, práctico y antecedentes", "Sólo el examen práctico", "Sólo un examen de sangre"], "ok": 1, "exp": "El resultado del teórico se obtiene al instante; la licencia puede tardar 1 o 2 días."}, {"id": "b9-37", "tema": "Licencia, sanciones y trámites", "cap": "9 · pág. 169", "q": "Por motivos de trabajo no podrá presentarse a repetir el examen dentro de los 25 días hábiles. ¿Qué puede hacer?", "ops": ["Nada: pierde el al?", "ops": ["Pare inmediatamente", "Proximidad de una señal PARE", "Fin de la zona de PARE", "Prohibido detenerse"], "ok": 1, "exp": "Es preventiva: anuncia que más adelante hay un PARE."}, {"id": "s-32", "tema": "Señales", "cap": "Anexo 1 · pág. 155", "img": "dossentidos", "q": "¿Qué indica esta señal?", "ops": ["Dos sentidos de tránsito", "Autopista", "Prohibido adelantar", "Calle de un solo sentido"], "ok": 0, "exp": "Típica al terminar una vía de un sentido o una calzada doble."}, {"id": "s-33", "tema": "Señales", "cap": "Anexo 1 · pág. 154", "img": "resalto", "q": "¿Qué indica esta señal?", "ops": ["Túnel", "Resalto", "Puente", "Cima"], "ok": 1, "exp": "Reduzca la velocidad antes del resalto."}, {"id": "s-34", "tema": "Señales", "cap": "Anexo 1 · pág. 156", "img": "resbaladizo", "q": "¿Qué indica esta señal?", "ops": ["Pavimento resbaladizo", "Zona de lavado", "Prohibido adelantar", "Calle en mal estado"], "ok": 0, "exp": "Baje la velocidad, aumente la distancia y evite frenadas o giros bruscos."}, {"id": "s-35", "tema": "Señales", "cap": "Anexo 1 · pág. 154", "img": "angostamiento", "q": "¿Qué indica esta señal?", "ops": ["Ensanchamiento de la vía", "Angostamiento a ambos lados", "Puente angosto adelante", "Comienzo de dos pistas"], "ok": 1, "exp": "La calzada se estrecha: reduzca la velocidad y atención a quien viene de frente."}, {"id": "s-36", "tema": "Señales", "cap": "Anexo 1 · pág. 153", "img": "viento", "q": "¿Qué indica esta señal?", "ops": ["Viento lateral", "Río", "Calefacción", "Neblina"], "ok": 0, "exp": "Reduzca la velocidad, sujete firme el volante y corrija contra el viento."}, {"id": "s-37", "tema": "Señales", "cap": "Anexo 1 · pág. 154", "img": "sanandres", "q": "¿Qué indica esta señal (cruz blanca con borde rojo)?", "ops": ["Cruce de caminos", "Cruce ferroviario a nivel", "Hospital cercano", "Prohibido el paso"], "ok": 1, "exp": "Es la excepción entre las preventivas: no es un rombo amarillo. El tren siempre tiene preferencia."}, {"id": "s-38", "tema": "Señales", "cap": "Anexo 1 · pág. 154", "img": "barreras", "q": "¿Qué indica esta señal?", "ops": ["Barreras", "Zona de obras", "Fin de autopista", "Estacionamiento"], "ok": 0, "exp": "Prepárese para detenerse."}, {"id": "s-39", "tema": "Señales", "cap": "6 · pág. 81", "img": "trabajos", "q": "¿Qué indica esta señal de color NARANJA?", "ops": ["Trabajos en la vía", "Zona turística", "Peligro permanente", "Servicios"], "ok": 0, "exp": "Las transitorias (naranjas) señalan riesgos no permanentes por obras: modere la velocidad."}, {"id": "s-40", "tema": "Señales", "cap": "Anexo 1 · pág. 157", "img": "hospital", "q": "¿Qué tipo de señal es esta?", "ops": ["Reglamentaria", "Informativa de servicios", "Preventiva de peligro", "Transitoria por obras"], "ok": 1, "exp": "Las informativas de servicios son azules; las de turismo, café."}, {"id": "s-41", "tema": "Señales", "cap": "Anexo 1 · pág. 158", "img": "estacionamiento", "q": "¿Qué indica esta señal?", "ops": ["Prohibido estacionar", "Estacionamiento permitido", "Entrada de autopista", "Bencinera"], "ok": 1, "exp": "Informativa: lugar donde está permitido estacionar."}, {"id": "s-42", "tema": "Señales", "cap": "Anexo 1 · pág. 158", "img": "autopista", "q": "¿Qué indica esta señal?", "ops": ["Inicio de autopista", "Puente", "Fin de autopista", "Túnel"], "ok": 0, "exp": "En autopista no se detiene ni estaciona salvo emergencia, y se entra por la pista de aceleración."}, {"id": "s-43", "tema": "Señales", "cap": "Anexo 1 · pág. 158", "img": "sos", "q": "¿Qué indica esta señal?", "ops": ["Teléfono de emergencia", "Plaza de peaje", "Radio de tránsito", "Control policial"], "ok": 0, "exp": "En túneles, pida ayuda sólo desde el teléfono SOS: el celular no indica dónde está."}, {"id": "s-44", "tema": "Señales", "cap": "6 · pág. 80-81", "q": "Una señal tiene forma de ROMBO, fondo AMARILLO y símbolo negro. ¿Qué tipo es?", "ops": ["Reglamentaria", "De advertencia de peligro", "Informativa de destino", "Transitoria por obras"], "ok": 1, "exp": "Reglamentarias: circulares con borde rojo (salvo excepciones). Preventivas: rombos amarillos. Informativas: rectangulares azules/verdes/café. Transitorias: naranjas."}, {"id": "x-01", "tema": "Licencia, sanciones y trámites", "cap": "Ley de Tránsito", "q": "¿Qué vehículos permite conducir la licencia Clase B?", "ops": ["Sólo autos de hasta 5 asientos", "Hasta 9 asientos o carga hasta 3.500 kg", "Camiones de cualquier tamaño agrícolas", "Buses y taxis si no se cobra pasaje"], "ok": 1, "exp": "Clase B: vehículos de 3 o más ruedas para transporte particular de personas (hasta 9 asientos, sin contar el del conductor) o de carga con peso máximo de 3.500 kg. No sirve para transporte remunerado ni para camiones de más de 3.500 kg (licencia profesional A4/A5)."}, {"id": "x-02", "tema": "Licencia, sanciones y trámites", "cap": "Examen Nexteo", "q": "¿Cómo es el examen teórico Clase B (sistema Nexteo)?", "ops": ["35 preguntas; aprueba con 25 respuestas correctas", "35 preguntas, 3 de doble puntaje (38 puntos); aprueba con 33", "50 preguntas; aprueba con 40 respuestas correctas", "20 preguntas; aprueba con 15 en 30 minutos"], "ok": 1, "exp": "35 preguntas en 45 minutos. Tres valen doble (alcohol, velocidad, cinturón, casco, sillas para niños): total 38. Se necesitan 33, es decir, como máximo 5 puntos de error."}, {"id": "x-03", "tema": "Licencia, sanciones y trámites", "cap": "Canje de licencias", "q": "Tiene licencia francesa y reside en Chile. ¿Puede canjearla por una chilena?", "ops": ["Sí, Francia tiene convenio de canje con Chile", "No: con Francia no hay convenio, debe rendir los exámenes", "Sí, presentando una traducción oficial", "Sí, después de un año de residencia"], "ok": 1, "exp": "Chile tiene convenios de canje con pocos países (por ejemplo Argentina, Bolivia, Brasil, Colombia, Corea del Sur, Ecuador, España, Japón, Paraguay y Perú). Con Francia hay que hacer el proceso completo."}]</script>
