<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d2329; --muted:#5d6670; --line:#ddd6c8;
  --brand:#0f3d5e; --brand-ink:#ffffff; --ok:#1e7a46; --ok-bg:#e3f3e9; --bad:#b3261e; --bad-bg:#fbe7e5;
  --gold:#b7791f; --chip:#ece6da; --fs:19px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121619; --card:#1c2226; --ink:#eef1f3; --muted:#a4adb5; --line:#2d353b;
    --brand:#5aa9d6; --brand-ink:#0b1a24; --ok:#57c785; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1d1b; --chip:#262d32; --gold:#e5b454;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:1.35em;margin:.2em 0 .1em}
h2{font-size:1.1em;margin:1.2em 0 .5em}
p{margin:.4em 0}
.muted{color:var(--muted);font-size:.85em}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.iconbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:.85em}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.big{display:block;width:100%;text-align:left;border:none;border-radius:16px;padding:18px;margin:10px 0;font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.big b{display:block;font-size:1.05em}
.big span{color:var(--muted);font-size:.85em}
.big.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.big.primary span{color:inherit;opacity:.85}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:.75em;color:var(--muted);margin-right:6px}
.chip.gold{background:var(--gold);color:#fff}
.q{font-size:1.08em;font-weight:600;margin:10px 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;padding:14px;margin:8px 0;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt .l{font-weight:700;color:var(--muted);min-width:1.2em}
.opt.sel{border-color:var(--brand)}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:14px;margin:12px 0}
.fb.good{background:var(--ok-bg)} .fb.wrong{background:var(--bad-bg)}
.fb b{display:block;margin-bottom:4px}
.next{position:sticky;bottom:12px;z-index:2;width:100%;padding:16px;border:none;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;margin-top:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.sign{display:flex;justify-content:center;margin:6px 0 4px}
.sign svg{width:130px;height:130px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{font-size:2em;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.9em}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;white-space:nowrap}
.pill{font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--chip)}
.dots i.a{background:var(--brand)}
.hide{display:none}
small.ref{display:block;margin-top:6px;color:var(--muted)}
input[type=file]{font-size:.85em}
</style>
</head>
<body>
<main id="app"></main>

<script id="banco" type="application/json">[{"id": "b1-01", "tema": "Siniestros y Sistema Seguro", "cap": "1 · pág. 6", "q": "¿Por qué el libro prefiere hablar de «siniestros de tránsito» y no de «accidentes»?", "ops": ["Porque los seguros sólo pagan si se habla de «siniestro» y no de accidente", "Porque la mayoría no son casuales: son evitables y tienen responsables", "Porque «accidente» se usa sólo cuando hay personas fallecidas", "Porque la ley prohíbe usar la palabra «accidente» en los partes"], "ok": 1, "exp": "Un «accidente» se asocia a algo casual. Pero los siniestros aumentan con la lluvia, de noche o con alcohol: no son azar. La mayoría de las muertes podría haberse evitado."}, {"id": "b1-02", "tema": "Siniestros y Sistema Seguro", "cap": "1 · pág. 6", "q": "En Chile, para los niños de 1 a 14 años, ¿qué lugar ocupan los siniestros de tránsito entre las causas de muerte?", "ops": ["La primera causa de muerte", "La segunda causa", "La quinta causa", "No están entre las principales"], "ok": 0, "exp": "En niños de 1 a 14 años son la primera causa de muerte; en jóvenes de 15 a 29 años, la segunda (después de los suicidios)."}, {"id": "b1-03", "tema": "Siniestros y Sistema Seguro", "cap": "1 · pág. 8", "q": "¿Dónde se producen la mayoría de los siniestros de tránsito en Chile, y dónde la mayoría de los fallecidos?", "ops": ["Ambos en zonas urbanas, sobre todo en cruces y rotondas", "Los siniestros en ciudad; los fallecidos, sobre todo en carreteras", "Ambos en carreteras, por las velocidades más altas", "Los siniestros en carretera; los fallecidos, sobre todo en la ciudad"], "ok": 1, "exp": "Cerca del 80 % de los siniestros ocurre en zonas urbanas, la mayoría en intersecciones. Pero la mayor parte de los fallecidos se produce en carreteras, donde las velocidades son mayores."}, {"id": "b1-04", "tema": "Siniestros y Sistema Seguro", "cap": "1 · pág. 8", "q": "Según el libro, ¿qué pasa con la probabilidad de que un peatón muera atropellado si el vehículo pasa de 30 a 50 km/h?", "ops": ["Se duplica aproximadamente", "Se multiplica por ocho", "No cambia de forma importante", "Aumenta un poco, cerca de un 20 %"], "ok": 1, "exp": "De 30 a 50 km/h, la probabilidad de muerte del peatón se multiplica por ocho. A 30 km/h o menos sobrevive el 90 %; a 65 km/h lo más probable es que muera."}, {"id": "b1-05", "tema": "Siniestros y Sistema Seguro", "cap": "1 · pág. 8", "q": "¿En qué porcentaje aproximado de los siniestros está presente la falla humana?", "ops": ["En cerca del 30 %", "En la mitad", "En más del 90 %", "En menos del 10 %"], "ok": 2, "exp": "La falla humana está presente en más del 90 % de los siniestros. Imprudencia, alcohol y desobediencia a las señales están entre los factores principales."}, {"id": "b1-06", "tema": "Siniestros y Sistema Seguro", "cap": "1 · pág. 9", "q": "¿Cuál de estos es un principio del enfoque «Sistema Seguro» (Visión Cero)?", "ops": ["Quien conduce bien no comete errores: hay que sancionar a los demás", "Errar es humano: el sistema debe evitar que un error cause muertes", "Los siniestros son inevitables: sólo se puede reducir su costo", "La responsabilidad recae únicamente en la persona que conduce"], "ok": 1, "exp": "Sistema Seguro: «errar es humano»; el cuerpo humano resiste fuerzas limitadas; la responsabilidad es compartida (quienes diseñan, construyen, administran y usan las vías); si un componente falla, los demás siguen protegiendo."}, {"id": "b1-07", "tema": "Siniestros y Sistema Seguro", "cap": "1 · pág. 8", "q": "¿En qué momentos hay mayor siniestralidad, según las estadísticas?", "ops": ["Días laborales a mediodía, cuando hay más vehículos en la calle", "Fines de semana, noche y madrugada, o con poco flujo vehicular", "En horas punta, porque la congestión aumenta los choques", "En las mañanas de invierno, por la helada y la neblina"], "ok": 1, "exp": "Fines de semana (normales o largos), noche, madrugada y situaciones de escaso flujo vehicular concentran más siniestros."}, {"id": "b2-01", "tema": "El vehículo", "cap": "2 · pág. 11", "q": "En el tablero, ¿qué indica un testigo (luz) de color ROJO?", "ops": ["Que un sistema está funcionando", "Atención inmediata: avería grave", "Un posible problema a revisar más adelante", "Que las luces altas están encendidas"], "ok": 1, "exp": "Rojo: atención inmediata, avería grave. Amarillo/ámbar: posible problema a revisar. Verde: sistema en funcionamiento."}, {"id": "b2-02", "tema": "El vehículo", "cap": "2 · pág. 11", "q": "¿Qué instrumento del tablero muestra las revoluciones por minuto del motor?", "ops": ["El velocímetro", "El odómetro", "El tacómetro", "El indicador de temperatura"], "ok": 2, "exp": "Tacómetro: revoluciones del motor. Velocímetro: rapidez del vehículo. Odómetro: distancia recorrida."}, {"id": "b2-03", "tema": "El vehículo", "cap": "2 · pág. 12", "q": "Conduciendo, se enciende la luz de presión de aceite. Según el libro, ¿qué debe hacer?", "ops": ["Seguir con precaución hasta el próximo servicentro y revisar ahí", "Detener el motor de inmediato y no usarlo hasta repararlo", "Acelerar un poco para que la bomba suba la presión de aceite", "Bajar una marcha y seguir: la luz se apaga cuando el motor se calienta"], "ok": 1, "exp": "Indica que el motor no está siendo lubricado (nivel de aceite bajo). Seguir puede causar averías graves: detenga el motor de inmediato."}, {"id": "b2-04", "tema": "El vehículo", "cap": "2 · pág. 12", "q": "Una luz o accesorio eléctrico deja de funcionar. ¿Qué es lo primero que debe revisar?", "ops": ["La carga de la batería del vehículo", "Si se ha fundido algún fusible", "La correa y el estado del alternador", "El motor de arranque y sus cables"], "ok": 1, "exp": "Casi todos los accesorios eléctricos tienen fusibles. Si una unidad deja de funcionar, lo primero es revisar el fusible."}, {"id": "b2-05", "tema": "El vehículo", "cap": "2 · pág. 12", "q": "El testigo de los intermitentes parpadea más rápido de lo normal. ¿Qué indica probablemente?", "ops": ["Que la batería está cargada al máximo", "Que se quemó una ampolleta", "Que el motor todavía está frío", "Que el alternador carga demasiado"], "ok": 1, "exp": "Si el control de los intermitentes destella más rápido que lo habitual, es probable que una ampolleta esté quemada."}, {"id": "b2-06", "tema": "El vehículo", "cap": "2 · pág. 13", "q": "Al cargar combustible, ¿qué recomienda el libro?", "ops": ["Dejar el motor encendido para que el estanque se llene mejor", "Apagar el motor, no fumar, no usar el celular y no inhalar vapores", "Llenar sólo hasta la mitad para que no se rebalse con el calor", "Usar siempre la gasolina de mayor octanaje para cuidar el motor"], "ok": 1, "exp": "Motor apagado, sin cigarrillos ni celular, evitando los vapores (inflamables y posiblemente cancerígenos). Use el octanaje que indica el fabricante."}, {"id": "b2-07", "tema": "El vehículo", "cap": "2 · pág. 13", "q": "Mientras conduce, siente un fuerte olor a gasolina. ¿Qué hace?", "ops": ["Abre las ventanas para ventilar y sigue hasta su destino", "Se detiene para buscar la causa: hay riesgo de incendio", "Acelera para llegar lo antes posible a un taller mecánico", "Enciende el aire acondicionado para eliminar el olor"], "ok": 1, "exp": "Un olor fuerte a gasolina puede indicar una fuga: hay riesgo de incendio. Deténgase y revise."}, {"id": "b2-08", "tema": "El vehículo", "cap": "2 · pág. 13", "q": "En el indicador de temperatura del motor, ¿qué significan las letras C y H?", "ops": ["C = caliente, H = helado", "C = frío (Cold), H = caliente (Hot)", "C = combustible, H = hidráulico", "C = carga, H = horas"], "ok": 1, "exp": "Vienen del inglés: C = Cold (frío), H = Hot (caliente). En el indicador de combustible: E = Empty (vacío), F = Full (lleno)."}, {"id": "b2-09", "tema": "El vehículo", "cap": "2 · pág. 14", "q": "¿Cuáles son los primeros síntomas de intoxicación con monóxido de carbono dentro del vehículo, y qué hacer?", "ops": ["Sueño y hambre; tomar un café y seguir conduciendo", "Dolor de cabeza y vómitos; salir y respirar aire fresco", "Fiebre y escalofríos; subir la calefacción del vehículo", "Picazón en los ojos; encender el aire acondicionado"], "ok": 1, "exp": "El monóxido de carbono (gas del escape) es venenoso, incoloro e inodoro. Puede entrar por un escape dañado o al circular con el portaequipaje abierto. A la menor señal, salga y respire aire fresco."}, {"id": "b2-10", "tema": "El vehículo", "cap": "2 · pág. 14", "q": "¿Qué ocurre si conduce con el pie sobre el embrague más tiempo del necesario?", "ops": ["Ahorra combustible en la ciudad", "Se reduce el control sobre el vehículo", "Mejora la frenada en bajadas", "No tiene ningún efecto en autos nuevos"], "ok": 1, "exp": "Con el embrague presionado se interrumpe la transmisión hacia las ruedas: se pierde control. Úselo sólo lo necesario."}, {"id": "b2-11", "tema": "El vehículo", "cap": "2 · pág. 15", "q": "Al conducir en terreno plano, el vehículo tiende a irse hacia un lado y la dirección se siente pesada. ¿Qué puede indicar?", "ops": ["Que el estanque está muy lleno y pesa más de un lado", "Un defecto en la dirección o poca presión en neumáticos delanteros", "Que la batería está baja y la servodirección no funciona bien", "Que el motor está frío y todavía no alcanza su temperatura"], "ok": 1, "exp": "Dirección pesada, chirridos al doblar o que el auto se vaya hacia un lado indican defecto de dirección o baja presión en los neumáticos delanteros."}, {"id": "b2-12", "tema": "El vehículo", "cap": "2 · pág. 15", "q": "¿Cuál de estos es un síntoma de amortiguadores en mal estado?", "ops": ["El motor tarda en arrancar y el tacómetro sube sin acelerar", "Se inclina mucho al frenar, se balancea y las luces oscilan", "Huele a gasolina y el consumo de combustible aumenta", "Los frenos chirrían y el pedal se siente más duro de lo normal"], "ok": 1, "exp": "Amortiguadores gastados: inclinación excesiva al frenar, balanceo, rebotes, desgaste irregular de neumáticos, luces que oscilan. Además aumentan la distancia de frenado y reducen la eficacia del ABS."}, {"id": "b2-13", "tema": "El vehículo", "cap": "2 · pág. 16", "q": "Muchos autos tienen servofreno. ¿Qué precaución implica?", "ops": ["Ninguna: frena igual con el motor encendido o apagado", "Sólo funciona con el motor en marcha; sin él, el pedal se pone duro", "Funciona mejor con el motor apagado, por eso se apaga en bajadas", "Obliga a frenar siempre suave para no bloquear las ruedas"], "ok": 1, "exp": "El servofreno aumenta mucho la fuerza de frenado, pero sólo con el motor en marcha. Sin motor, hay que pisar el pedal con mucha más fuerza."}, {"id": "b2-14", "tema": "El vehículo", "cap": "2 · pág. 16", "q": "Acaba de cruzar una calle inundada o de lavar el auto. ¿Qué recomienda el libro?", "ops": ["Nada en especial: los frenos modernos no se mojan", "Frenar suavemente a baja velocidad para secar los frenos", "Acelerar fuerte unos minutos para secar el motor y los frenos", "Usar sólo el freno de mano hasta que se sequen los frenos"], "ok": 1, "exp": "La humedad reduce la eficacia de los frenos. Frenando suavemente a baja velocidad se secan. También cuando el auto estuvo guardado mucho tiempo o con temperaturas bajo cero."}, {"id": "b2-15", "tema": "El vehículo", "cap": "2 · pág. 17", "q": "Tiene que frenar de emergencia en un auto CON ABS. ¿Cómo lo hace?", "ops": ["Bombeando el pedal rápidamente para que no se bloqueen las ruedas", "Pedal a fondo y mantenerlo: el ABS permite seguir dirigiendo", "Con el freno de mano, que es más efectivo en emergencias", "Suavemente, porque si se activa el ABS el auto frena peor"], "ok": 1, "exp": "El ABS reduce un poco la presión cuando detecta bloqueo, mientras usted mantiene el pedal a fondo. Así las ruedas siguen girando y puede esquivar. Si el ABS falla, los frenos siguen funcionando."}, {"id": "b2-16", "tema": "El vehículo", "cap": "2 · pág. 24", "q": "Frena de golpe en un auto SIN ABS y las ruedas se bloquean. ¿Qué hace?", "ops": ["Mantiene el pedal a fondo hasta que el auto se detenga", "Afloja un poco el pedal para que las ruedas vuelvan a girar", "Tira el freno de mano para ayudar a detener el vehículo", "Gira el volante a fondo para esquivar el obstáculo"], "ok": 1, "exp": "Con las ruedas bloqueadas el auto no obedece a la dirección y frena peor. Sin ABS, si se bloquean, hay que aflojar el pedal de inmediato."}, {"id": "b2-17", "tema": "El vehículo", "cap": "2 · pág. 17", "q": "El nivel del líquido de frenos ha bajado. ¿Qué significa?", "ops": ["Que es normal: el líquido se consume poco a poco con el uso", "Que hay un defecto, como una fuga: este líquido no se consume", "Que hace frío y el líquido se contrae, sin mayor problema", "Que sólo hay que cambiar las pastillas de freno"], "ok": 1, "exp": "El líquido de frenos no se consume. Si baja, hay un problema. Un nivel bajo puede causar un siniestro."}, {"id": "b2-18", "tema": "El vehículo", "cap": "2 · pág. 17", "q": "Al pisar el freno, el pedal se siente «elástico», como esponjoso. ¿Qué puede indicar?", "ops": ["Que los frenos son nuevos y todavía se están asentando", "Que probablemente entró aire al sistema de frenos", "Que el ABS está funcionando correctamente", "Que el líquido de frenos está recién cambiado"], "ok": 1, "exp": "El pedal debe sentirse rígido. Si cede, probablemente hay aire en el sistema. Si baja estando presionado fuerte, puede haber fugas."}, {"id": "b2-19", "tema": "El vehículo", "cap": "2 · pág. 18", "q": "Según el libro, ¿cuál es la profundidad MÍNIMA ACONSEJABLE de los surcos de los neumáticos, y bajo cuánto el riesgo es grave?", "ops": ["1 mm aconsejable; peligroso recién bajo 0,5 mm", "3 mm aconsejable; bajo 1,6 mm el agarre en mojado es muy malo", "5 mm aconsejable; peligroso bajo 3 mm", "2 mm aconsejable; peligroso bajo 1 mm"], "ok": 1, "exp": "Se aconseja al menos 3 mm. Bajo 1,6 mm (límite que marcan los detectores de desgaste) aumenta mucho el riesgo de perder contacto con el pavimento mojado."}, {"id": "b2-20", "tema": "El vehículo", "cap": "2 · pág. 18", "q": "Una rueda DELANTERA tiene poca presión de aire. ¿Qué efecto produce?", "ops": ["El vehículo tiende a torcer hacia el lado de esa rueda", "El auto acelera mejor", "Ninguno", "El vehículo tiende a torcer hacia el lado contrario"], "ok": 0, "exp": "Poca presión en una rueda delantera hace que el auto tire hacia ese lado; en ambas delanteras, la dirección se pone pesada. Con poca presión atrás, aumenta la tendencia al giro."}, {"id": "b2-21", "tema": "El vehículo", "cap": "2 · pág. 19", "q": "Un neumático muestra desgaste sólo en la ZONA CENTRAL de la banda. ¿Qué indica?", "ops": ["Que se usó con exceso de aire", "Que se usó con poca presión", "Que está bien alineado", "Que es nuevo"], "ok": 0, "exp": "Desgaste en el centro = exceso de presión. Desgaste sólo en los bordes = presión baja. Desgaste irregular = alineación, amortiguación o presión inadecuada."}, {"id": "b2-22", "tema": "El vehículo", "cap": "2 · pág. 19", "q": "Conduciendo, revienta un neumático TRASERO y la cola del auto se desvía. ¿Qué indica el libro?", "ops": ["Frenar a fondo y mantener el volante recto", "Girar hacia el lado al que se desvía la cola y detenerse despacio", "Girar hacia el lado contrario al que se desvía la cola", "Acelerar para estabilizar el vehículo y seguir hasta un taller"], "ok": 1, "exp": "Neumático trasero: girar hacia donde se desvía la cola. Neumático delantero: frenar suave sosteniendo el volante firme. En ambos casos, detenerse lentamente al costado."}, {"id": "b2-23", "tema": "El vehículo", "cap": "2 · pág. 19", "q": "Aunque tengan buen dibujo y poco uso, ¿cada cuánto se recomienda cambiar los neumáticos?", "ops": ["Cada año, aunque el dibujo esté en buen estado", "Al menos cada 5 años, porque el material envejece", "Cada 10 años, si el auto se usa poco", "Nunca, mientras el dibujo supere el mínimo legal"], "ok": 1, "exp": "El caucho envejece y pierde sus propiedades aunque el auto se use poco: el libro recomienda cambiarlos al menos cada 5 años."}, {"id": "b2-24", "tema": "El vehículo", "cap": "2 · pág. 19", "q": "¿Dónde puede encontrar la presión de aire correcta para sus neumáticos?", "ops": ["En el permiso de circulación o en el padrón del vehículo", "En el manual o en la etiqueta del marco de la puerta del conductor", "En el certificado de la revisión técnica", "Impresa en el costado de cualquier neumático"], "ok": 1, "exp": "La presión la indica el fabricante: manual o tabla adosada al marco de la puerta, guantera o motor. Se controla con los neumáticos fríos."}, {"id": "b2-25", "tema": "El vehículo", "cap": "2 · pág. 20", "q": "Además de las luces de freno normales, ¿qué luz de freno es obligatoria en automóviles, camionetas, furgones y transporte escolar?", "ops": ["Una luz roja intermitente en el techo", "Una tercera luz de freno al centro de la luneta trasera", "Una luz de niebla trasera en el parachoques", "Una luz ámbar en cada espejo lateral"], "ok": 1, "exp": "Además de las dos luces de freno, debe haber una tercera luz de freno ubicada al centro de la luneta trasera."}, {"id": "b2-26", "tema": "El vehículo", "cap": "2 · pág. 20", "q": "¿Cuándo deben usarse las luces intermitentes de advertencia de peligro (balizas)?", "ops": ["Para estacionar en doble fila mientras hace un trámite corto", "Con el auto detenido por avería, ante un peligro adelante o al ser remolcado", "Siempre que llueva fuerte o haya neblina en carretera", "Para agradecer a otro conductor que le cedió el paso"], "ok": 1, "exp": "Sólo por falla/avería, peligro u obstrucción adelante, o al ser remolcado, y sólo el tiempo necesario. Nunca como excusa para estacionar mal."}, {"id": "b2-27", "tema": "El vehículo", "cap": "2 · pág. 21", "q": "¿Cuándo se pueden usar las luces neblineras?", "ops": ["Siempre de noche en carreteras sin alumbrado público", "Sólo con visibilidad muy reducida, y apagarlas apenas mejora", "En la ciudad, para ver mejor las calles sin iluminación", "Para hacerse visible al adelantar en carretera"], "ok": 1, "exp": "Son opcionales y sólo para visibilidad considerablemente reducida. Deben apagarse en cuanto mejora la visibilidad, porque encandilan."}, {"id": "b2-28", "tema": "El vehículo", "cap": "2 · pág. 21", "q": "La mayoría de los espejos laterales son convexos. ¿Qué significa para usted?", "ops": ["Que los vehículos se ven más cerca de lo que realmente están", "Que los vehículos parecen más lejanos o pequeños de lo que son", "Que eliminan completamente los puntos ciegos", "Que muestran el tamaño y la distancia exactos"], "ok": 1, "exp": "En un espejo convexo, lo que se ve parece más lejos. Además siempre existe un punto ciego: hay que girar la cabeza antes de cambiar de pista."}, {"id": "b2-29", "tema": "El vehículo", "cap": "2 · pág. 22", "q": "Al tomar el volante en una posición correcta, ¿cómo deben quedar sus brazos?", "ops": ["Totalmente estirados", "Ligeramente flexionados", "Muy doblados, con el pecho cerca del volante", "Uno estirado y otro apoyado en la ventana"], "ok": 1, "exp": "Brazos ligeramente flexionados: mejor control y menor riesgo con el airbag. También: calzado adecuado, sin objetos sueltos y espejos regulados antes de partir."}, {"id": "b2-30", "tema": "El vehículo", "cap": "2 · pág. 22", "q": "¿Qué elementos debe llevar siempre en el vehículo para emergencias, según el libro?", "ops": ["Sólo los documentos del vehículo y la licencia", "Reflectantes, extintor, rueda de repuesto y herramientas", "Un bidón de gasolina y un botiquín", "Cables para batería, una cuerda y una linterna"], "ok": 1, "exp": "Reflectantes (triángulos), extintor, rueda de repuesto y herramientas. Y nada suelto que pueda golpear a alguien en un frenazo."}, {"id": "b2-31", "tema": "Velocidad y distancias", "cap": "2 · pág. 23", "q": "¿Qué es la distancia de reacción?", "ops": ["Lo que recorre desde que pisa el freno hasta detenerse", "Lo que recorre mientras usted reacciona, antes de frenar", "La distancia que debe dejar con el auto de adelante", "La distancia que alcanza a iluminar con las luces bajas"], "ok": 1, "exp": "Distancia de reacción: lo recorrido mientras reacciona (un tiempo normal es 1 segundo). Distancia de frenado: desde que frena hasta detenerse. Detención = reacción + frenado."}, {"id": "b2-32", "tema": "Velocidad y distancias", "cap": "2 · pág. 23-24", "q": "Con un tiempo de reacción de 1 segundo, ¿cuántos metros recorre aproximadamente a 50 km/h antes de empezar a frenar? (Truco del libro: primera cifra de la velocidad × 3)", "ops": ["5 metros", "15 metros", "30 metros", "50 metros"], "ok": 1, "exp": "5 × 3 = 15 m. A 90 km/h: 9 × 3 = 27 m. Sobre 100 km/h se usan las dos primeras cifras: 110 km/h → 11 × 3 = 33 m."}, {"id": "b2-33", "tema": "Velocidad y distancias", "cap": "2 · pág. 24", "q": "Si TRIPLICA la velocidad, ¿cuánto aumenta la distancia de frenado?", "ops": ["3 veces", "6 veces", "9 veces", "No cambia"], "ok": 2, "exp": "La distancia de frenado crece con el cuadrado de la velocidad: el doble → 4 veces; el triple → 9 veces."}, {"id": "b2-34", "tema": "Velocidad y distancias", "cap": "2 · pág. 23", "q": "¿Cuándo debe reducir la velocidad para tomar una curva?", "ops": ["En medio de la curva, cuando ve cuán cerrada es", "Antes de la curva, y acelerar suave a la salida", "Al salir de la curva, para no perder adherencia dentro", "No es necesario si conoce bien el camino"], "ok": 1, "exp": "La fuerza que saca al auto de la curva depende de la velocidad y de lo cerrada que sea la curva. Se frena antes de entrar y se acelera suave al salir."}, {"id": "b2-35", "tema": "El vehículo", "cap": "2 · pág. 25", "q": "Baja una pendiente pronunciada. ¿Qué NO debe hacer nunca?", "ops": ["Usar una marcha baja para frenar con el motor", "Bajar en neutro", "Frenar con suavidad y anticipación", "Reducir la velocidad antes de la bajada"], "ok": 1, "exp": "En neutro se pierde el freno motor y el control. Use una marcha baja para que el motor frene y los frenos no se recalienten."}, {"id": "b2-36", "tema": "El vehículo", "cap": "2 · pág. 25", "q": "En un vehículo de tracción TRASERA, las ruedas pierden adherencia y la cola da «coletazos». ¿Qué recomienda el libro?", "ops": ["Frenar a fondo y soltar el volante", "Seguir acelerando suave y girar hacia la trayectoria deseada", "Soltar el acelerador de golpe y frenar", "Poner neutro y dejar que el auto se estabilice solo"], "ok": 1, "exp": "Tracción trasera: seguir acelerando y corregir con la dirección hacia la trayectoria. Tracción delantera: si las ruedas patinan al acelerar, dejar de acelerar y retomar la trayectoria."}, {"id": "b2-37", "tema": "El vehículo", "cap": "2 · pág. 25", "q": "En un auto de tracción DELANTERA, acelera demasiado en una curva y las ruedas delanteras patinan (el auto no gira). ¿Qué hace?", "ops": ["Acelera más para recuperar tracción", "Deja de acelerar y retoma su trayectoria", "Frena a fondo y gira el volante", "Gira más el volante hacia la curva"], "ok": 1, "exp": "Si las ruedas motrices delanteras resbalan, el auto sigue recto. Hay que dejar de acelerar para que recuperen adherencia."}, {"id": "b2-38", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 26", "q": "¿Cuál es la diferencia entre seguridad ACTIVA y PASIVA?", "ops": ["No hay diferencia: son dos nombres para lo mismo", "Activa: evita el siniestro. Pasiva: reduce sus consecuencias", "Activa: el cinturón y el airbag. Pasiva: los frenos y las luces", "Activa: la que usa electricidad. Pasiva: la mecánica"], "ok": 1, "exp": "Activa = evitar el siniestro. Pasiva = proteger a los ocupantes durante el siniestro."}, {"id": "b2-39", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 26", "doble": true, "q": "Un choque a 50 km/h sin cinturón equivale, según el libro, a:", "ops": ["Caer de una silla: un golpe menor", "Tirarse a la calle desde un cuarto piso", "Caer desde un metro de altura", "Un golpe leve, gracias a la carrocería"], "ok": 1, "exp": "A 50 km/h equivale a caer desde un 4.º piso; a 70 km/h, desde un 7.º; a 90 km/h, desde un piso 11."}, {"id": "b2-40", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 26", "doble": true, "q": "Según el libro, ¿cuándo es OBLIGATORIO el cinturón en los asientos TRASEROS?", "ops": ["Nunca: atrás sólo es recomendable", "Sólo en carretera, no en la ciudad", "En vehículos fabricados desde 2002", "Sólo para menores de 18 años"], "ok": 2, "exp": "El libro indica que en los asientos traseros es obligatorio en vehículos fabricados desde 2002. Pero todos deben ir sujetos: un pasajero trasero sin cinturón puede matar a los de adelante."}, {"id": "b2-41", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 26", "q": "Dos niños quieren compartir un mismo cinturón en el asiento trasero. ¿Es correcto?", "ops": ["Sí, si ambos son pequeños y el viaje es corto", "No: nunca dos personas con un mismo cinturón", "Sí, si el cinturón está bien ajustado sobre ambos", "Sí, si van en el asiento central"], "ok": 1, "exp": "El libro es claro: nunca permitas que dos personas viajen sujetas con un mismo cinturón."}, {"id": "b2-42", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 27", "q": "¿Por dónde debe pasar la banda TORÁCICA (diagonal) del cinturón?", "ops": ["Sobre el cuello, para que no se deslice", "Sobre la clavícula, bajando por el centro del pecho", "Por debajo del brazo, para mayor comodidad", "Sobre el extremo del hombro, cerca del brazo"], "ok": 1, "exp": "Sobre el cuello puede causar lesiones graves; sobre el borde del hombro puede deslizarse y perder eficacia."}, {"id": "b2-43", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 27", "q": "¿Cómo debe usar el cinturón una persona EMBARAZADA?", "ops": ["No debe usarlo: es peligroso para el bebé", "Banda abdominal sobre la cadera, por debajo del vientre", "Banda abdominal sobre el vientre, bien ajustada", "Sólo la banda diagonal, sin la abdominal"], "ok": 1, "exp": "La banda abdominal va siempre por debajo del abdomen, sobre la cadera, también en el embarazo. Sin cinturón, el riesgo de perder al bebé en un choque es mayor."}, {"id": "b2-44", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 28", "q": "¿Qué es el «efecto submarino»?", "ops": ["Cuando el auto cae al agua y se hunde", "Cuando la persona se desliza bajo la banda abdominal", "Cuando se empañan los vidrios por la humedad", "Cuando el airbag se infla antes de tiempo"], "ok": 1, "exp": "Se evita con buena postura (no ir semiacostado), cinturón bien tenso, sin cojines ni toallas en el asiento y sin ropa muy voluminosa."}, {"id": "b2-45", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 28", "q": "Según el libro, ¿qué pasa si sale eyectado del vehículo por no llevar cinturón?", "ops": ["Es más seguro: se aleja del vehículo que choca", "Aumentan mucho el riesgo de lesión medular y de morir", "No cambia nada si el choque es a baja velocidad", "Sólo es peligroso en carretera, no en la ciudad"], "ok": 1, "exp": "Es un mito que sea mejor salir eyectado: es mucho más seguro quedar dentro del vehículo, sujeto por el cinturón."}, {"id": "b2-46", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 30", "q": "¿Por qué el airbag NO es eficaz sin el cinturón de seguridad?", "ops": ["Porque sin cinturón el airbag no se activa", "Porque golpea con fuerza a un cuerpo no retenido", "Porque sólo protege a quienes van atrás", "Sí es eficaz: el airbag reemplaza al cinturón"], "ok": 1, "exp": "El airbag complementa al cinturón, no lo reemplaza. Junto al cinturón puede reducir un 20 % la probabilidad de lesiones mortales."}, {"id": "b2-47", "tema": "Cinturón y niños", "cap": "2 · pág. 30", "doble": true, "q": "¿Se puede instalar una silla para niños (SRI) en el asiento delantero?", "ops": ["Sí, siempre que el niño vaya bien sujeto", "Sólo en cabina simple y con el airbag desactivado", "Sí, si la silla va mirando hacia adelante", "Sí, en trayectos cortos y a baja velocidad"], "ok": 1, "exp": "El airbag frontal puede herir gravemente a un niño. Sólo en vehículos sin asiento trasero (cabina simple) y con el airbag desactivado."}, {"id": "b2-48", "tema": "Cinturón, airbag y apoyacabezas", "cap": "2 · pág. 31", "q": "¿Cómo debe regularse el apoyacabezas?", "ops": ["A la altura de los hombros, para apoyar la nuca", "Borde superior entre lo alto de la cabeza y los ojos, cerca de ella", "Lo más bajo posible, para no tapar la visión trasera", "Lo más alejado posible de la cabeza, para mayor comodidad"], "ok": 1, "exp": "Previene el «efecto latigazo» en choques por detrás, que puede causar esguince cervical e incluso tetraplejia. Debe regularse para cada ocupante, adelante y atrás."}, {"id": "b3-01", "tema": "Convivencia vial", "cap": "3 · pág. 33", "q": "¿Cuál es, según el libro, el mayor riesgo al conducir?", "ops": ["El mal estado de las calles y caminos", "La imprudencia y falta de práctica de quien conduce", "El clima, sobre todo la lluvia y la neblina", "Los vehículos antiguos sin elementos de seguridad"], "ok": 1, "exp": "Cerca del 90 % de los siniestros con víctimas son por fallas humanas, de personas con una percepción equivocada del riesgo."}, {"id": "b3-02", "tema": "Convivencia vial", "cap": "3 · pág. 34", "q": "¿Qué es el «principio de confianza» en el tránsito?", "ops": ["Confiar en que nunca nos pasará un siniestro", "Esperar que cada usuario cumpla su papel y respete las normas", "Confiar en la propia habilidad para conducir rápido", "Confiar en que el otro frenará si uno no alcanza a hacerlo"], "ok": 1, "exp": "Sin ese principio nadie se atrevería a salir a la calle. Pasarse una luz roja, por ejemplo, debilita la confianza de todos."}, {"id": "b3-03", "tema": "Convivencia vial", "cap": "3 · pág. 35", "q": "¿Cuál es el principio fundamental en la conducción, según el libro?", "ops": ["La rapidez para reaccionar ante los imprevistos", "La precaución: conducir a la defensiva y prevenir", "La habilidad para controlar el vehículo", "El conocimiento mecánico del vehículo"], "ok": 1, "exp": "La precaución es el principio fundamental: conducción defensiva y preventiva. Y la solidaridad, la mejor virtud al volante."}, {"id": "b3-04", "tema": "Convivencia vial", "cap": "3 · pág. 34", "q": "¿Qué factores de riesgo destaca el libro como causa de pérdida de control y siniestros?", "ops": ["El color del auto y el tipo de neumáticos", "Distracciones, alcohol, fatiga y velocidad", "Escuchar música y conversar con pasajeros", "Conducir de día con mucho sol de frente"], "ok": 1, "exp": "La velocidad inadecuada está presente en la cuarta parte de los siniestros con víctimas. Las distracciones son una de las principales causas."}, {"id": "b3-05", "tema": "Convivencia vial", "cap": "3 · pág. 35", "q": "Otro conductor parece no haberlo visto. ¿Qué actitud recomienda el libro?", "ops": ["Tocar la bocina y seguir: usted tiene preferencia", "No suponer que lo vio y conducir a la defensiva", "Acelerar para pasar antes de que reaccione", "Encender las luces altas y mantener su trayectoria"], "ok": 1, "exp": "«Ver y ser visto» y no asumir que los demás nos vieron. La prevención es la principal defensa."}, {"id": "b4-01", "tema": "Percepción y atención", "cap": "4 · pág. 37", "q": "Según estadísticas internacionales, las personas conductoras principiantes sufren siniestros sin otros vehículos involucrados con una frecuencia:", "ops": ["Igual a las experimentadas", "2 veces mayor", "10 veces mayor", "Menor, porque son más prudentes"], "ok": 2, "exp": "Los principiantes sufren este tipo de siniestros 10 veces más. El buen juicio se adquiere con horas al volante."}, {"id": "b4-02", "tema": "Percepción y atención", "cap": "4 · pág. 39", "q": "De noche, ve a lo lejos una sola luz que se acerca y cree que es una moto. Resulta ser un auto con un foco apagado. ¿Qué lección da el libro?", "ops": ["Que las motos son difíciles de ver y hay que evitarlas", "Que con pocos indicios (noche, niebla) hay que desconfiar de lo que uno percibe", "Que siempre hay que usar luces altas para identificar a los demás", "Que el otro conductor es el único responsable si ocurre algo"], "ok": 1, "exp": "Interpretaciones erróneas del entorno son comunes y peligrosas. Una buena regla: desconfiar de las propias percepciones y no conducir con cansancio."}, {"id": "b4-03", "tema": "Percepción y atención", "cap": "4 · pág. 39", "q": "Va a 90 km/h en carretera y quiere cambiar la estación de radio. ¿Qué dice el libro sobre hacer dos cosas a la vez?", "ops": ["No hay problema si lo hace rápido y con una mano", "Es muy riesgoso: puede perder el control o reaccionar tarde", "Sólo es peligroso de noche o con lluvia", "Está permitido si no supera los 100 km/h"], "ok": 1, "exp": "Las distracciones (radio, teléfono, comer, fumar, discutir, problemas emocionales) reducen el tiempo para reaccionar. Conducir requiere toda la atención."}, {"id": "b4-04", "tema": "Percepción y atención", "cap": "4 · pág. 40", "q": "¿Quién logrará detener primero el vehículo ante un imprevisto?", "ops": ["Quien tiene mejores reflejos, aunque vaya más rápido", "Quien va más lento, aunque reaccione un poco más tarde", "Quien tiene el auto más nuevo y con mejores frenos", "Ambos al mismo tiempo, si reaccionan igual"], "ok": 1, "exp": "La velocidad pesa más que los reflejos: quien va más lento se detiene antes."}, {"id": "b4-05", "tema": "Percepción y atención", "cap": "4 · pág. 40", "q": "En situaciones reales de tránsito (reacciones complejas), ¿qué grupo de edad reacciona más rápido según el libro?", "ops": ["Los jóvenes de 18 a 25 años, por sus reflejos", "Las personas de 35 a 50 años", "Los mayores de 65 años, por su experiencia", "Todas las edades reaccionan igual"], "ok": 1, "exp": "Los jóvenes sólo son más rápidos en reacciones simples (algo esperado). En situaciones complejas, las personas experimentadas reaccionan mucho más rápido; el grupo de 35 a 50 años es el «más rápido»."}, {"id": "b4-06", "tema": "Percepción y atención", "cap": "4 · pág. 40", "q": "De noche, al cruzarse dos vehículos con luces bajas, ¿hasta qué distancia aproximada se ve?", "ops": ["100 metros", "Unos 15 a 20 metros", "50 metros", "Igual que de día"], "ok": 1, "exp": "Al cruzarse con luces bajas, la visibilidad no supera 15 a 20 m; sin cruce, se ven las demarcaciones hasta unos 70 m. Por eso hay que reducir la velocidad de noche."}, {"id": "b4-07", "tema": "Percepción y atención", "cap": "4 · pág. 41", "q": "Un peatón camina de noche por el borde de un camino rural. ¿Qué ropa lo hace más visible?", "ops": ["Ropa oscura, porque contrasta con los focos", "Ropa con material reflectante", "Ropa roja, porque es el color de alerta", "Da igual: los focos iluminan todo"], "ok": 1, "exp": "Ropa oscura: refleja sólo el 5 % de la luz. Ropa blanca: 80 %. Material reflectante: 90 a 98 %."}, {"id": "b4-08", "tema": "Percepción y atención", "cap": "4 · pág. 41", "q": "¿Qué es la «percepción selectiva»?", "ops": ["Ver sólo con un ojo cuando el otro está cansado", "Ver lo que uno espera ver y tardar en notar lo inesperado", "Elegir la ruta con menos tráfico y mejor visibilidad", "Ver mejor de noche que de día gracias a los focos"], "ok": 1, "exp": "El cerebro selecciona la información según expectativas, necesidades y nivel de vigilancia. Con prisa, se descarta lo que «estorba», y se corre el riesgo de pasar por alto peligros."}, {"id": "b4-09", "tema": "Percepción y atención", "cap": "4 · pág. 43", "q": "¿Cómo usa la vista un conductor con experiencia, comparado con un principiante?", "ops": ["Mira fijo delante del capó para no perder la pista", "Usa más la visión periférica y explora de forma sistemática", "Mira casi todo el tiempo los espejos retrovisores", "No hay diferencia: todos miran de la misma forma"], "ok": 1, "exp": "Se descubre con la visión periférica y se reconoce con la visión directa. Explorar de forma sistemática permite detectar peligros antes."}, {"id": "b4-10", "tema": "Percepción y atención", "cap": "4 · pág. 43", "q": "¿Por qué es fácil subestimar la velocidad en un auto moderno, en una carretera recta y buena?", "ops": ["Porque los velocímetros modernos suelen marcar menos", "Por el silencio, la falta de vibraciones y la ruta monótona", "Porque los límites de velocidad en carretera son altos", "Porque los autos modernos frenan en menos distancia"], "ok": 1, "exp": "Subestimar la velocidad lleva a errores al juzgar la distancia de frenado o al tomar curvas. Mire el velocímetro."}, {"id": "b4-11", "tema": "Percepción y atención", "cap": "4 · pág. 44", "q": "¿Qué es la «visión de túnel»?", "ops": ["Lo que se ve al entrar en un túnel oscuro", "El campo visual se reduce al aumentar la velocidad", "Una enfermedad de la vista propia de personas mayores", "El encandilamiento producido por el sol de frente"], "ok": 1, "exp": "Cuanto más rápido, más lejos fija la mirada y menos ve a los costados: peatones, ciclistas o autos que salen de un cruce."}, {"id": "b4-12", "tema": "Percepción y atención", "cap": "4 · pág. 44", "q": "Va a 90 km/h y se cruzará con un vehículo que viene de frente a 100 km/h. ¿Dónde se cruzarán realmente?", "ops": ["Exactamente a mitad de camino entre ambos", "Más cerca de usted de lo que cree", "Más lejos de usted de lo que cree", "No se puede estimar de ninguna forma"], "ok": 1, "exp": "El cerebro supone que ambos van a la misma velocidad y estima el punto medio. Como el otro va más rápido, el cruce real está más cerca de usted. Clave al decidir un adelantamiento."}, {"id": "b4-13", "tema": "Actitud y emociones", "cap": "4 · pág. 45", "q": "¿Cuál es la edad para optar a una licencia de conducir?", "ops": ["16 años, con autorización de los padres", "18 años (o excepcionalmente 17)", "21 años, salvo curso de conductores", "20 años en todo el país"], "ok": 1, "exp": "18 años, o excepcionalmente 17 (con requisitos especiales). Es la edad en que la sociedad considera alcanzada la madurez necesaria."}, {"id": "b4-14", "tema": "Actitud y emociones", "cap": "4 · pág. 47", "q": "Lleva a amigos en el auto y le piden que acelere y haga maniobras para impresionarlos. ¿Qué es lo correcto?", "ops": ["Hacerlo un poco, en una recta, para no parecer miedoso", "Negarse: usted es responsable de todos los ocupantes", "Dejar que otro conduzca, aunque haya bebido algo", "Acelerar sólo donde no haya Carabineros"], "ok": 1, "exp": "La presión social puede ser muy negativa. Una persona conductora responsable sabe decir que no, aunque se burlen de su prudencia, y no lleva más pasajeros de los permitidos."}, {"id": "b4-15", "tema": "Actitud y emociones", "cap": "4 · pág. 46-47", "q": "Otro conductor le hace una maniobra incorrecta y usted siente rabia. ¿Qué es lo correcto según el libro?", "ops": ["Seguirlo de cerca para que entienda su error", "Dominar la rabia: la agresividad lleva a decisiones impulsivas", "Tocar la bocina y hacerle cambio de luces repetidamente", "Adelantarlo y frenar delante de él para advertirle"], "ok": 1, "exp": "Autocontrol: dominar la ira, incluso si el otro se equivocó, es primordial para tomar buenas decisiones."}, {"id": "b4-16", "tema": "Actitud y emociones", "cap": "4 · pág. 48", "q": "¿Cuál de estas es una «conducta que implica riesgo» según el libro?", "ops": ["Respetar las señales aunque no haya nadie", "La impulsividad: actuar sin pensar en las consecuencias", "Descansar cada 2 horas en viajes largos", "Usar el cinturón también en trayectos cortos"], "ok": 1, "exp": "Conductas de riesgo: impulsividad, no asumir la culpa, represión (ignorar los riesgos), formación de reacción (el inseguro que se muestra agresivo) y validación (querer demostrar o defender su «derecho» a toda costa)."}, {"id": "b4-17", "tema": "Actitud y emociones", "cap": "4 · pág. 49", "q": "Está oscureciendo y la carretera brilla por una capa de agua, pero usted sigue a la misma velocidad porque quiere llegar a la hora. ¿Qué conducta de riesgo describe el libro aquí?", "ops": ["La empatía: ponerse en el lugar de los demás", "La represión: ignorar el riesgo porque otra cosa parece más urgente", "La validación: querer demostrar habilidad ante otros", "La solidaridad: ayudar a quien necesita pasar"], "ok": 1, "exp": "Uno sabe que el riesgo aumenta, pero lo «reprime» para cumplir otro objetivo (llegar a tiempo). Así crece enormemente la probabilidad de un siniestro."}, {"id": "b4-18", "tema": "Alcohol y drogas", "cap": "4 · pág. 50", "doble": true, "q": "Según la Ley Tolerancia Cero, ¿qué rango de alcohol en la sangre corresponde a conducir «BAJO LA INFLUENCIA del alcohol»?", "ops": ["0,1 a 0,3 gramos por mil", "0,31 a 0,79 gramos por mil", "0,8 a 1,2 gramos por mil", "Más de 1,5 gramos por mil"], "ok": 1, "exp": "0,31 a 0,79 g/l: bajo la influencia (multas y suspensión de licencia). 0,8 o más: estado de ebriedad (multas, cancelación de licencia y cárcel)."}, {"id": "b4-19", "tema": "Alcohol y drogas", "cap": "4 · pág. 50", "doble": true, "q": "¿Qué sanción corresponde a conducir en ESTADO DE EBRIEDAD (0,8 g/l o más)?", "ops": ["Sólo una multa, si es la primera vez", "Multas, cancelación de la licencia y cárcel", "Suspensión de licencia por un mes y curso obligatorio", "Una advertencia y retención del vehículo por un día"], "ok": 1, "exp": "El estado de ebriedad es delito: multas, cancelación de licencia y cárcel. Las sanciones aumentan con reincidencia o si hay daños, lesionados o fallecidos."}, {"id": "b4-20", "tema": "Alcohol y drogas", "cap": "4 · pág. 50", "q": "Con una alcoholemia entre 0,5 y 0,8 g/l, ¿cuánto aumenta el riesgo de sufrir un siniestro?", "ops": ["No aumenta si la persona está acostumbrada", "Es el doble que sin haber bebido", "Es cinco veces mayor que sin haber bebido", "Es diez veces mayor que sin haber bebido"], "ok": 2, "exp": "Entre 0,3 y 0,5 g/l el riesgo se duplica; entre 0,5 y 0,8 g/l es cinco veces mayor."}, {"id": "b4-21", "tema": "Alcohol y drogas", "cap": "4 · pág. 51", "doble": true, "q": "Un conductor en estado de ebriedad causa lesiones gravísimas a otra persona. ¿Qué establece la Ley Emilia?", "ops": ["Una multa alta", "Cárcel efectiva de al menos un año", "Suspensión de licencia por 3 meses", "Trabajos comunitarios"], "ok": 1, "exp": "Ley Emilia (2014): cárcel efectiva mínima de un año si un conductor ebrio causa lesiones gravísimas o la muerte. Son agravantes la reincidencia y conducir con licencia cancelada."}, {"id": "b4-22", "tema": "Alcohol y drogas", "cap": "4 · pág. 51", "q": "Después de un siniestro, el conductor se niega sin justificación a hacerse la prueba de alcohol. ¿Qué ocurre?", "ops": ["Nada: negarse es un derecho de la persona", "Suspensión, multas y posible cárcel según las consecuencias", "Se le presume sobrio y se cierra el procedimiento", "Sólo pierde la cobertura del seguro del vehículo"], "ok": 1, "exp": "Negarse injustificadamente a la prueba respiratoria u otra prueba también tiene sanciones severas."}, {"id": "b4-23", "tema": "Alcohol y drogas", "cap": "4 · pág. 51", "doble": true, "q": "Según el libro, ¿cuál es la única tasa de alcohol segura para conducir?", "ops": ["0,3 g/l", "0,5 g/l", "0 (cero)", "Depende de la persona"], "ok": 2, "exp": "«La única tasa de alcohol segura para conducir es 0». Si va a beber, no conduzca."}, {"id": "b4-24", "tema": "Alcohol y drogas", "cap": "4 · pág. 51", "q": "¿Qué capacidades afecta primero el alcohol, incluso en pequeñas dosis?", "ops": ["Sólo la fuerza muscular y la coordinación de las piernas", "Visión periférica, atención, reacción y decisión, antes de notarlo", "Sólo el equilibrio al caminar, no la conducción", "Ninguna, mientras no se supere el límite legal"], "ok": 1, "exp": "Desde 0,1 g/l cambia el comportamiento: aumenta la autoconfianza y uno sobreestima su capacidad. Las funciones decisivas se afectan antes que la parte motriz."}, {"id": "b4-25", "tema": "Alcohol y drogas", "cap": "4 · pág. 52", "doble": true, "q": "Bebió anoche y quiere eliminar el alcohol más rápido para conducir. ¿Qué funciona?", "ops": ["Un café cargado y un vaso de agua", "Una ducha fría y comer algo dulce", "Hacer ejercicio para transpirar el alcohol", "Nada: sólo el paso del tiempo"], "ok": 3, "exp": "La metabolización es constante: café, dulces, cigarrillo, ducha o ejercicio no la aceleran. Dormir pocas horas no garantiza haber eliminado el alcohol."}, {"id": "b4-26", "tema": "Alcohol y drogas", "cap": "4 · pág. 52", "q": "Dos personas beben exactamente lo mismo. ¿Quién tendrá probablemente más alcohol en la sangre?", "ops": ["La de mayor peso", "La de menor peso corporal", "Las dos igual siempre", "La que bebió con el estómago lleno"], "ok": 1, "exp": "A menor peso, mayor alcoholemia. También influyen el sexo, la rapidez con que se bebe, la comida y la edad. Por eso es imposible predecir el resultado."}, {"id": "b4-27", "tema": "Alcohol y drogas", "cap": "4 · pág. 52", "q": "¿Cuánto tiempo después de beber se alcanza, en promedio, el nivel máximo de alcohol en la sangre?", "ops": ["5 minutos", "Alrededor de una hora", "6 horas", "Al día siguiente"], "ok": 1, "exp": "Se detecta en la sangre a los 5 minutos y el máximo llega en promedio a la hora. Salir «rápido antes de que haga efecto» es un error."}, {"id": "b4-28", "tema": "Alcohol y drogas", "cap": "4 · pág. 53", "q": "¿Qué efecto tiene mezclar alcohol con bebidas gaseosas (carbonatadas)?", "ops": ["Disminuye el efecto, porque diluye el alcohol", "Aumenta la absorción del alcohol", "Ayuda a eliminar el alcohol más rápido", "Ninguno, sólo cambia el sabor"], "ok": 1, "exp": "Las bebidas carbonatadas aceleran la absorción. La comida, en cambio, reduce el paso de alcohol a la sangre (pero no lo elimina)."}, {"id": "b4-29", "tema": "Alcohol y drogas", "cap": "4 · pág. 53", "q": "¿Qué efecto de la marihuana es especialmente peligroso al conducir?", "ops": ["Mejora la concentración porque relaja", "Altera la percepción de distancia y velocidad y da sueño", "Es estimulante y mejora los reflejos un tiempo", "No afecta la conducción si se consume poco"], "ok": 1, "exp": "La marihuana es depresora y alucinógena, no estimulante. La cocaína, en cambio, vuelve más competitivo, agresivo e impulsivo, y hace sobreestimar las capacidades."}, {"id": "b4-30", "tema": "Alcohol y drogas", "cap": "4 · pág. 55", "q": "Consumió una droga hace varias horas y ya «no siente nada». ¿Puede conducir con seguridad?", "ops": ["Sí, si ya no siente ningún efecto", "No: que no sienta efectos no garantiza conducir seguro", "Sí, si toma un café antes de salir", "Sí, si conduce despacio y por calles conocidas"], "ok": 1, "exp": "El libro es claro: si ha consumido cualquier droga, no conduzca."}, {"id": "b4-31", "tema": "Salud y medicamentos", "cap": "4 · pág. 56", "q": "Según el libro, ¿qué tipo de enfermedades tienen mayor riesgo de provocar siniestros?", "ops": ["Los resfríos y las alergias estacionales", "Los trastornos neurológicos", "Las enfermedades de la piel", "Los problemas dentales y digestivos"], "ok": 1, "exp": "También implican riesgo: enfermedades cardiovasculares, problemas motores, artritis, problemas de audición y de visión. Si no se siente bien, no conduzca."}, {"id": "b4-32", "tema": "Salud y medicamentos", "cap": "4 · pág. 57", "q": "Después de un infarto, ¿cuándo aconseja el libro volver a conducir?", "ops": ["Al día siguiente de salir del hospital", "Luego de 3 meses después del evento", "Nunca más: queda inhabilitado de por vida", "Después de 1 semana de reposo"], "ok": 1, "exp": "La tabla del libro aconseja conducir luego de 3 meses después de un infarto, y siempre consultar al médico tratante."}, {"id": "b4-33", "tema": "Salud y medicamentos", "cap": "4 · pág. 58", "q": "Va a 90 km/h y estornuda (1 segundo). ¿Cuántos metros recorre sin prestar atención al camino?", "ops": ["Unos 2 metros", "Unos 25 metros", "Unos 100 metros", "Nada, es muy rápido"], "ok": 1, "exp": "A 90 km/h el auto recorre unos 25 m por segundo. Las alergias y los antihistamínicos pueden afectar mucho la conducción."}, {"id": "b4-34", "tema": "Salud y medicamentos", "cap": "4 · pág. 60", "q": "Algunos antihistamínicos (para alergias) producen un riesgo al conducir equivalente a:", "ops": ["Nada: los antihistamínicos son inofensivos", "Conducir bajo la influencia del alcohol", "Conducir con lentes de sol de noche", "Conducir con un leve resfrío"], "ok": 1, "exp": "Hay antihistamínicos que no dan sueño y son más seguros. Nunca se deben mezclar con alcohol ni con otros medicamentos."}, {"id": "b4-35", "tema": "Salud y medicamentos", "cap": "4 · pág. 56", "q": "Tiene una enfermedad crónica. ¿Cuál de estas acciones recomienda el libro?", "ops": ["Dejar el tratamiento cuando se sienta bien para viajar", "Conocer su enfermedad y sus fármacos, no conducir en crisis", "Conducir sólo de noche, cuando hay menos tráfico", "Tomar el doble de dosis antes de un viaje largo"], "ok": 1, "exp": "Nunca modifique ni abandone un tratamiento sin indicación médica, y pregunte al médico por los riesgos al conducir."}, {"id": "b4-36", "tema": "Salud y medicamentos", "cap": "4 · pág. 59", "q": "¿Qué recomienda el libro a una persona con depresión respecto a conducir?", "ops": ["Conducir de noche por carretera para relajarse", "Evitar conducir de noche, mucho rato o en rutas monótonas", "Conducir rápido para distraerse de los problemas", "Nada especial: la depresión no afecta la conducción"], "ok": 1, "exp": "La depresión puede causar ensimismamiento, somnolencia, inseguridad y reacciones impulsivas, y algunos medicamentos también afectan."}, {"id": "b4-37", "tema": "Cansancio y sueño", "cap": "4 · pág. 62", "q": "¿Qué porcentaje de los siniestros está asociado al sueño, según datos internacionales?", "ops": ["Menos del 1 %", "Entre 15 y 30 %", "Más del 80 %", "Exactamente 50 %"], "ok": 1, "exp": "Entre el 15 y el 30 % de los siniestros tiene relación directa o indirecta con el sueño, y muchos son graves, sobre todo en carretera."}, {"id": "b4-38", "tema": "Cansancio y sueño", "cap": "4 · pág. 62", "q": "¿Qué es un «microsueño»?", "ops": ["Una siesta corta y recomendada en viajes largos", "Unos segundos dormido sin darse cuenta", "Un sueño profundo durante la noche anterior", "Un bostezo seguido de un parpadeo largo"], "ok": 1, "exp": "Numerosos siniestros se producen por microsueños. A 90 km/h, 3 segundos son unos 75 metros «a ciegas»."}, {"id": "b4-39", "tema": "Cansancio y sueño", "cap": "4 · pág. 63", "q": "Conduciendo cansado empieza a sentir FRÍO y quiere subir la calefacción. ¿Qué dice el libro?", "ops": ["Es buena idea: estar cómodo ayuda a concentrarse", "Es traicionera: el calor dará más sueño; ventile y deténgase", "Significa que ya se le pasó el cansancio", "Es señal de que el motor se está enfriando"], "ok": 1, "exp": "Primeras señales: falta de interés, bostezos, boca seca, sensación de frío. Luego párpados pesados, velocidad irregular, cabeceo. Hay que detenerse mucho antes."}, {"id": "b4-40", "tema": "Cansancio y sueño", "cap": "4 · pág. 63", "q": "¿En qué horarios aparece más fácilmente la somnolencia, aunque haya dormido bien?", "ops": ["De 8 a 10 de la mañana", "De 3 a 5 h y de 14 a 16 h", "De 18 a 20 h, al volver del trabajo", "De 10 a 12 h y de 22 a 24 h"], "ok": 1, "exp": "Madrugada entre 3 y 5 horas y primeras horas de la tarde entre 14 y 16 horas. Ojo también después de una comida abundante."}, {"id": "b4-41", "tema": "Cansancio y sueño", "cap": "4 · pág. 64", "q": "Después de una larga jornada de trabajo físico, toma una bebida energética para conducir de vuelta. ¿Qué advierte el libro?", "ops": ["Que resuelve el cansancio por varias horas", "Que al pasar su efecto el sueño puede volver de golpe", "Que es la mejor alternativa a una pausa", "Que mejora los reflejos toda la noche"], "ok": 1, "exp": "Café, té, mate o bebidas energéticas ayudan un momento, pero luego el sueño puede volver de golpe. La solución real es descansar."}, {"id": "b4-42", "tema": "Cansancio y sueño", "cap": "4 · pág. 66", "doble": false, "q": "En un viaje largo, ¿cada cuánto y cuánto tiempo recomienda el libro descansar?", "ops": ["5 a 10 minutos cada 4 horas", "20 a 30 minutos cada 2 horas o 200 km", "1 hora cada 6 horas o 500 km", "Sólo al llegar, si el viaje dura menos de 5 horas"], "ok": 1, "exp": "Descanse al menos 20-30 minutos cada 2 horas o 200 km. Si tiene sueño, deténgase y duerma: 20 o 30 minutos bastan en la mayoría de los casos."}, {"id": "b4-43", "tema": "Cansancio y sueño", "cap": "4 · pág. 66", "q": "Según el libro, ¿cuál es la PRINCIPAL causa de fatiga al volante?", "ops": ["Escuchar música con volumen alto", "Conducir mucho rato sin descansar", "Usar lentes de sol en días nublados", "Conducir de día con mucho tráfico"], "ok": 1, "exp": "También favorecen la fatiga: mucho tráfico, mal pavimento, caminos desconocidos, noche, lluvia, mala ventilación, calor, posturas incómodas y poca experiencia."}, {"id": "b4-44", "tema": "Cansancio y sueño", "cap": "4 · pág. 65", "q": "¿Cuál de estos es un movimiento indicador de fatiga, según el libro?", "ops": ["Mirar los espejos con mucha frecuencia", "Cambiar seguido de postura, bostezar o silbar", "Mantener ambas manos en el volante", "Reducir la velocidad antes de las curvas"], "ok": 1, "exp": "Son señales de que el cuerpo pide descanso. La fatiga también vuelve a la persona más irritable y la hace asumir más riesgos."}, {"id": "b4-45", "tema": "Cansancio y sueño", "cap": "4 · pág. 63", "q": "Si duerme una o dos horas menos de lo que necesita, varios días seguidos, ¿qué ocurre?", "ops": ["Nada: el cuerpo se acostumbra rápido", "En pocos días tendrá una gran somnolencia", "Se vuelve más alerta por la adrenalina", "Sólo afecta si conduce de noche"], "ok": 1, "exp": "La falta de sueño se acumula. Las personas con turnos cambiantes o jornadas largas son especialmente vulnerables a la somnolencia al volante."}, {"id": "b5-01", "tema": "Usuarios vulnerables", "cap": "5 · pág. 68", "q": "En Chile, los atropellos son cerca del 15 % de los siniestros. ¿Qué proporción de los fallecidos representan?", "ops": ["Cerca del 5 %", "Cerca del 28 %", "Cerca del 80 %", "Ninguno"], "ok": 1, "exp": "Los atropellos son el 15 % de los siniestros pero el 28 % de los fallecidos: el peatón no tiene protección."}, {"id": "b5-02", "tema": "Usuarios vulnerables", "cap": "5 · pág. 68", "q": "Circula por la pista izquierda y ve que en la pista derecha un vehículo está detenido antes de un paso de cebra. ¿Qué hace?", "ops": ["Lo adelanta rápido por la izquierda antes de que avance", "Reduce la velocidad y se prepara para detenerse", "Toca la bocina para que el vehículo detenido avance", "Sigue igual: en su pista usted tiene preferencia"], "ok": 1, "exp": "El vehículo detenido tapa la vista: un peatón puede aparecer justo delante de usted."}, {"id": "b5-03", "tema": "Usuarios vulnerables", "cap": "5 · pág. 68", "q": "Pasa junto a un bus detenido en un paradero. ¿Qué precaución toma?", "ops": ["Ninguna: los peatones deben esperar en el paradero", "Reduce la velocidad: puede salir un peatón delante o detrás", "Toca la bocina para avisar que va pasando", "Acelera para pasar antes de que el bus arranque"], "ok": 1, "exp": "Los peatones aparecen sorpresivamente alrededor de buses y vehículos estacionados, y probablemente no lo han visto."}, {"id": "b5-04", "tema": "Usuarios vulnerables", "cap": "5 · pág. 69", "q": "Ve a una persona aparentemente ebria cerca de la calzada. ¿Qué hace?", "ops": ["Toca la bocina para que se aparte de la calzada", "Reduce la velocidad y le da la preferencia", "Pasa rápido para no quedar cerca de ella", "Le hace cambio de luces para advertirle"], "ok": 1, "exp": "Las personas ebrias se comportan de forma imprevisible. Reduzca la velocidad y déjelas pasar."}, {"id": "b5-05", "tema": "Usuarios vulnerables", "cap": "5 · pág. 69", "q": "Una persona mayor cruza lentamente y se detiene en medio de la calzada. ¿Qué hace?", "ops": ["Toca la bocina suavemente para que se apure", "Le da todo el tiempo que necesite, sin presionarla", "La rodea por detrás con precaución", "Avanza despacio hacia ella para que siga"], "ok": 1, "exp": "Una persona mayor puede necesitar 4 segundos más que una joven para cruzar 16 m, puede oír mal o calcular mal la velocidad de los autos."}, {"id": "b5-06", "tema": "Usuarios vulnerables", "cap": "5 · pág. 69", "q": "¿Debe una persona con discapacidad auditiva o visual mostrar o señalar su impedimento?", "ops": ["Sí, con un distintivo visible en la ropa", "No: ante la duda, reduzca la velocidad", "Sólo si cruza fuera de un paso peatonal", "Sólo de noche o con poca visibilidad"], "ok": 1, "exp": "Los impedimentos pueden ser invisibles. No asuma que un peatón lo oye llegar."}, {"id": "b5-07", "tema": "Usuarios vulnerables", "cap": "5 · pág. 70", "q": "¿Hasta qué edad no está completamente desarrollada la vista de un niño?", "ops": ["Hasta los 3 años", "Hasta los 15 años", "Hasta los 8 años", "Hasta los 12 años"], "ok": 1, "exp": "Además, los niños son pequeños (no se ven tras autos estacionados), impulsivos, juegan siempre y calculan mal distancias y velocidades. Recién entre 9 y 12 años actúan con cierta seguridad en el tránsito."}, {"id": "b5-08", "tema": "Usuarios vulnerables", "cap": "5 · pág. 70", "q": "Pasa junto a un furgón escolar detenido. ¿Qué hace?", "ops": ["Lo adelanta rápido para no quedar detrás", "Pasa con mucha precaución, listo para detenerse", "Toca la bocina para avisar a los niños", "Nada especial: los niños bajan por la vereda"], "ok": 1, "exp": "También cerca de colegios (entrada/salida), zonas residenciales y carros de helados o golosinas: los niños se interesan más en eso que en el tránsito."}, {"id": "b5-09", "tema": "Usuarios vulnerables", "cap": "5 · pág. 70-71", "q": "En un camino rural, alcanza a una persona a caballo que va en su misma dirección y vienen muchos vehículos de frente. ¿Qué hace?", "ops": ["La adelanta de inmediato, dejando poco espacio", "Reduce, no se acerca y espera que pasen los autos para adelantar", "Toca la bocina para que se haga a un lado", "Acelera el motor para que el animal note su presencia"], "ok": 1, "exp": "No haga señales con luces o bocina ni acelere el motor cerca de animales: se asustan. En zonas rurales, atención especial en las curvas a la derecha."}, {"id": "b5-10", "tema": "Usuarios vulnerables", "cap": "5 · pág. 71", "q": "¿Dónde son especialmente frecuentes las colisiones con motociclistas?", "ops": ["En los estacionamientos de centros comerciales", "En los cruces, porque las motos son difíciles de ver a tiempo", "En autopistas vacías, por exceso de velocidad", "En los túneles, por el cambio de luz"], "ok": 1, "exp": "Al acercarse a un cruce, busque activamente motos. También ojo con los triciclos motorizados de carga: lentos y sin carrocería."}, {"id": "b5-11", "tema": "Usuarios vulnerables", "cap": "5 · pág. 71", "q": "Según el libro, ¿quiénes son «personas ciclistas»?", "ops": ["Sólo quienes andan en bicicleta por ciclovías", "Quienes usan cualquier ciclo", "Sólo los deportistas con equipo y casco", "Sólo los menores de 14 años en bicicleta"], "ok": 1, "exp": "Los ciclos son vehículos. El casco es su principal elemento de seguridad: reduce hasta tres veces el riesgo de lesiones en la cabeza."}, {"id": "b5-12", "tema": "Usuarios vulnerables", "cap": "5 · pág. 71", "q": "Va a pasar cerca de un ciclista que sube una cuesta con viento fuerte. ¿Qué espacio lateral debe dejar?", "ops": ["Unos 50 cm, si va despacio", "Al menos 1,5 metros", "No hace falta espacio si el ciclista va lento", "Exactamente 1 metro, como indica la ley"], "ok": 1, "exp": "La normativa exige al menos 1,5 m. Con viento o en subida, el ciclista se tambalea más."}, {"id": "b5-13", "tema": "Usuarios vulnerables", "cap": "5 · pág. 72", "q": "Va detrás de un ciclista, se acerca a un cruce y usted quiere virar a la derecha. ¿Qué hace?", "ops": ["Lo adelanta antes del cruce y luego vira", "No lo adelanta: espera que pase la intersección", "Toca la bocina para que se detenga y lo deje virar", "Vira por delante de él, porque usted es más rápido"], "ok": 1, "exp": "Adelantar a un ciclista y virarle encima es una causa clásica de siniestros. Recuerde también que los ciclos no tienen espejos."}, {"id": "b5-14", "tema": "Usuarios vulnerables", "cap": "5 · pág. 72", "q": "Un ciclista extiende el brazo IZQUIERDO horizontalmente. ¿Qué indica?", "ops": ["Que va a frenar", "Que va a virar a la izquierda", "Que va a virar a la derecha", "Que lo deja pasar"], "ok": 1, "exp": "Brazo izquierdo horizontal: viraje a la izquierda. Brazo izquierdo en ángulo recto hacia arriba (o derecho horizontal): viraje a la derecha. Brazo izquierdo hacia abajo: frenar o detenerse."}, {"id": "b5-15", "tema": "Usuarios vulnerables", "cap": "5 · pág. 72", "q": "Un ciclista lleva el brazo izquierdo extendido hacia ABAJO. ¿Qué indica?", "ops": ["Viraje a la izquierda", "Disminución de velocidad o detención", "Viraje a la derecha", "Que le cede el paso a usted"], "ok": 1, "exp": "Brazo izquierdo hacia abajo = va a reducir la velocidad o detenerse."}, {"id": "b5-16", "tema": "Usuarios vulnerables", "cap": "5 · pág. 72", "q": "¿Puede detenerse un momento sobre una ciclovía para dejar a un pasajero?", "ops": ["Sí, con las balizas encendidas", "No: ni circular, ni detenerse, ni estacionar", "Sí, si es menos de un minuto", "Sí, si no viene ningún ciclista"], "ok": 1, "exp": "Y si baja cerca de una ciclovía, mire si viene un ciclista antes de abrir la puerta."}, {"id": "b5-17", "tema": "Cinturón y niños", "cap": "5 · pág. 73", "doble": true, "q": "¿Qué sanción tiene llevar a un niño sin el Sistema de Retención Infantil obligatorio, o a un menor de 12 años adelante?", "ops": ["Una amonestación verbal la primera vez", "Falta gravísima: multa y suspensión de licencia", "Una multa leve, sin suspensión", "Ninguna, si el trayecto es corto"], "ok": 1, "exp": "Es falta gravísima. La obligación rige para vehículos particulares (no para transporte público ni escolar)."}, {"id": "b5-18", "tema": "Cinturón y niños", "cap": "5 · pág. 73", "doble": true, "q": "Según la Ley de Tránsito (desde 2017), ¿qué niños deben viajar en un Sistema de Retención Infantil?", "ops": ["Sólo los bebés menores de 2 años", "Hasta los 8 años o hasta 135 cm y 33 kg", "Todos los menores de 12 años", "Hasta los 5 años o hasta 100 cm"], "ok": 1, "exp": "Hasta los 8 años inclusive o hasta 135 cm / 33 kg. Además, los menores de 12 años van siempre atrás (salvo cabina simple)."}, {"id": "b5-19", "tema": "Cinturón y niños", "cap": "5 · pág. 74", "q": "Un niño ya grande usa sólo el cinturón del auto. ¿Cuándo le queda bien puesto?", "ops": ["Cuando la banda diagonal pasa por el cuello", "Banda por hombro y pecho, y sobre los muslos", "Cuando va sentado en el borde del asiento", "Cuando la banda diagonal pasa bajo el brazo"], "ok": 1, "exp": "Si no se cumplen esos puntos, necesita todavía un SRI (alzador). Un cinturón mal puesto puede dañar hígado, intestinos, vejiga y riñones."}, {"id": "b5-20", "tema": "Cinturón y niños", "cap": "5 · pág. 74", "q": "¿Desde cuándo debe usarse un Sistema de Retención Infantil?", "ops": ["Desde que el niño camina solo", "Desde el primer viaje, al nacer", "Desde los 2 años de edad", "Sólo en viajes por carretera"], "ok": 1, "exp": "Desde el primer viaje hasta que pueda usar el cinturón directamente. Un SRI mal instalado da una falsa sensación de seguridad."}, {"id": "b5-21", "tema": "Cinturón y niños", "cap": "5 · pág. 74-75", "q": "¿Cómo recomienda el libro instalar la silla de un niño pequeño, y hasta cuándo?", "ops": ["Mirando hacia adelante desde el nacimiento", "Mirando hacia atrás, mínimo hasta los 2 años", "Mirando hacia atrás sólo el primer mes", "En el asiento delantero para vigilarlo"], "ok": 1, "exp": "Mirando hacia atrás hasta alcanzar los límites de peso/altura del fabricante, como mínimo hasta los 2 años."}, {"id": "b5-22", "tema": "Cinturón y niños", "cap": "5 · pág. 75", "q": "Su auto tiene anclajes ISOFIX. ¿Debe fijar la silla con ISOFIX y además con el cinturón?", "ops": ["Sí, siempre los dos para mayor seguridad", "No: bien instalado, cada sistema es seguro por sí solo", "Sólo con el cinturón, el ISOFIX es opcional", "Sí, y además con una cuerda al asiento delantero"], "ok": 1, "exp": "Elija el sistema que pueda instalar correcta y fácilmente, siguiendo el manual del SRI y del vehículo."}, {"id": "b5-23", "tema": "Cinturón y niños", "cap": "5 · pág. 75", "q": "¿Cómo reconoce una silla para niños certificada en Chile?", "ops": ["Por su precio y una marca reconocida", "Por una etiqueta amarilla de acreditación", "Porque es importada de Europa o EE.UU.", "Por el sello de garantía del vendedor"], "ok": 1, "exp": "La etiqueta amarilla (9,5 × 7,5 cm) lleva un código: 3CV, ASN, marca, modelo, año y número de acreditación."}, {"id": "b5-24", "tema": "Cinturón y niños", "cap": "5 · pág. 73", "q": "Lleva niños atrás. ¿Qué dispositivo de las puertas debe usar?", "ops": ["El cierre centralizado siempre abierto", "Los seguros de niños", "Ninguno: basta con decirles que no abran", "Las ventanas abiertas para ventilar"], "ok": 1, "exp": "Los seguros de niños evitan que una puerta se abra en marcha. Y usted es el ejemplo: si usa cinturón, ellos también."}, {"id": "b6-01", "tema": "Carabineros y semáforos", "cap": "6 · pág. 77", "q": "Un Carabinero dirige el tránsito en un cruce donde el semáforo está en verde para usted, y le indica detenerse. ¿A quién obedece?", "ops": ["Al semáforo, porque es automático", "Al Carabinero", "Al que llegó primero al cruce", "A la señal vertical del cruce"], "ok": 1, "exp": "Las indicaciones de Carabineros de Chile prevalecen sobre semáforos y señales."}, {"id": "b6-02", "tema": "Carabineros y semáforos", "cap": "6 · pág. 77", "q": "Un Carabinero que dirige el tránsito se pone de COSTADO respecto de usted. ¿Qué significa?", "ops": ["Detenerse", "Que puede avanzar", "Que debe virar", "Advertencia"], "ok": 1, "exp": "De costado: autoriza a avanzar. De frente o de espalda: detención. Brazo en alto: advertencia (los detenidos se preparan; quienes tienen vía libre deben detenerse)."}, {"id": "b6-03", "tema": "Carabineros y semáforos", "cap": "6 · pág. 77", "q": "Un Carabinero levanta el brazo en alto mientras usted circula con vía libre. ¿Qué debe hacer?", "ops": ["Acelerar para cruzar antes del cambio", "Detenerse: es una advertencia de cambio", "Tocar la bocina para avisar que pasa", "Seguir igual: sólo afecta a los detenidos"], "ok": 1, "exp": "Brazo en alto = advertencia. Los que tenían vía libre deben detenerse, y los detenidos se preparan para avanzar cuando el Carabinero se ponga de costado."}, {"id": "b6-04", "tema": "Carabineros y semáforos", "cap": "6 · pág. 77", "q": "¿Qué entidades se encargan de velar por el cumplimiento de las normas de circulación?", "ops": ["Sólo Carabineros de Chile", "Carabineros e inspectores fiscales y municipales", "Sólo las municipalidades y sus inspectores", "Carabineros y las compañías de seguros"], "ok": 1, "exp": "Son tres: Carabineros, Inspectores Fiscales e Inspectores Municipales."}, {"id": "b6-05", "tema": "Carabineros y semáforos", "cap": "6 · pág. 78", "doble": false, "q": "¿Qué tipo de infracción es no respetar la luz roja de un semáforo?", "ops": ["Leve", "Menos grave", "Grave", "Gravísima"], "ok": 3, "exp": "Pasar con luz roja es infracción gravísima."}, {"id": "b6-06", "tema": "Carabineros y semáforos", "cap": "6 · pág. 78", "q": "Un semáforo muestra luz ROJA INTERMITENTE. Según el libro, ¿qué significa?", "ops": ["Lo mismo que la verde: tiene preferencia", "Ceda el paso: cruce si no vienen vehículos", "Prohibido el paso hasta que se apague", "Semáforo apagado: pase sin detenerse"], "ok": 1, "exp": "Libro 2026: roja intermitente = ceda el paso. Amarilla intermitente = peligro: aproximarse a velocidad reducida y continuar con precaución."}, {"id": "b6-07", "tema": "Carabineros y semáforos", "cap": "6 · pág. 78", "q": "Un semáforo muestra luz AMARILLA INTERMITENTE. ¿Qué debe hacer?", "ops": ["Detenerse siempre, como ante un PARE", "Acercarse lento y cruzar con precaución", "Acelerar para cruzar rápido", "Esperar a que vuelva la luz verde"], "ok": 1, "exp": "La amarilla intermitente advierte peligro: velocidad reducida y precaución."}, {"id": "b6-08", "tema": "Carabineros y semáforos", "cap": "6 · pág. 78", "q": "El semáforo cambia a amarillo y usted ya está DENTRO del cruce. ¿Qué hace?", "ops": ["Frena en seco en medio del cruce", "Continúa con precaución", "Retrocede", "Se detiene y espera la verde"], "ok": 1, "exp": "La amarilla obliga a detenerse antes de entrar al cruce; pero si lo sorprende tan cerca que no puede frenar con seguridad, o ya dentro del cruce, continúe con precaución."}, {"id": "b6-09", "tema": "Carabineros y semáforos", "cap": "6 · pág. 78", "q": "Tiene luz verde, pero pasado el cruce el tránsito está detenido. ¿Cuántos metros libres necesita en su pista para avanzar?", "ops": ["Ninguno, la verde basta", "Al menos 10 metros expeditos", "2 metros", "50 metros"], "ok": 1, "exp": "Aun con luz verde, no avance si pasado el cruce no tiene al menos 10 metros libres en su pista: quedaría bloqueando el cruce."}, {"id": "b6-10", "tema": "Carabineros y semáforos", "cap": "6 · pág. 78", "q": "Tiene luz verde y va a virar. Hay peatones y un ciclista cruzando por el paso peatonal con su propia luz verde. ¿Quién pasa primero?", "ops": ["Usted, porque tiene luz verde", "Los peatones y el ciclista", "El que llegue primero al cruce", "Los peatones sí, el ciclista no"], "ok": 1, "exp": "Los peatones (y ciclistas que usan el cruce peatonal) que también tienen luz verde tienen prioridad cuando usted vira."}, {"id": "b6-11", "tema": "Carabineros y semáforos", "cap": "6 · pág. 79", "q": "El semáforo muestra luz ROJA y además una FLECHA VERDE hacia la derecha. ¿Qué puede hacer?", "ops": ["Seguir derecho con precaución", "Avanzar con cuidado sólo hacia donde indica la flecha", "Nada: debe esperar la luz verde redonda", "Virar en cualquier dirección con precaución"], "ok": 1, "exp": "Con roja + flecha verde, sólo puede avanzar en la dirección de la flecha y con precaución."}, {"id": "b6-12", "tema": "Carabineros y semáforos", "cap": "6 · pág. 79", "q": "En un cruce ferroviario, la señal luminosa muestra luz BLANCA. ¿Qué significa?", "ops": ["Que se acerca un tren", "Que no viene tren, pero igual debe mirar", "Que debe detenerse siempre", "Que el cruce está cerrado"], "ok": 1, "exp": "Roja (o dos rojas alternadas): se acerca un tren. Blanca: no se acerca, lo que no significa que se pueda pasar sin mirar."}, {"id": "b6-13", "tema": "Carabineros y semáforos", "cap": "6 · pág. 80", "q": "Sobre la calzada hay una señal luminosa con una EQUIS (X) roja encima de una pista. ¿Qué indica?", "ops": ["Que la pista es exclusiva para buses", "Que la pista está cerrada", "Que hay un cruce", "Que puede estacionar"], "ok": 1, "exp": "Señales de mensaje variable: la X roja indica pista cerrada; la flecha indica pista abierta."}, {"id": "b6-14", "tema": "Señales y demarcaciones", "cap": "6 · pág. 80", "q": "¿Qué indican las señales REGLAMENTARIAS y cómo son en general?", "ops": ["Peligros; forma de rombo amarillo", "Prohibiciones y obligaciones; borde rojo", "Destinos y servicios; azules o verdes", "Obras en la vía; color naranja"], "ok": 1, "exp": "Hay excepciones de forma, como PARE, CEDA EL PASO, Fin Restricción, Paso Obligado o «Permitido virar derecha con luz roja»."}, {"id": "b6-15", "tema": "Señales y demarcaciones", "cap": "6 · pág. 80", "img": "finrestr", "q": "¿Qué indica esta señal?", "ops": ["Prohibido adelantar en ese tramo", "Fin de la restricción (no adelantar)", "Calle cerrada al tránsito", "Zona de vehículos lentos"], "ok": 1, "exp": "La señal FIN RESTRICCIÓN termina la restricción que muestra en su interior, cruzada por líneas diagonales."}, {"id": "b6-16", "tema": "Señales y demarcaciones", "cap": "6 · pág. 81", "q": "Pasa una señal de advertencia de peligro (rombo amarillo). ¿Qué recomienda el libro?", "ops": ["Adelantar rápido antes de llegar al peligro", "Evitar adelantar y reducir la velocidad", "Tocar la bocina para avisar a los demás", "Nada especial, si conoce el camino"], "ok": 1, "exp": "Las preventivas son rombos amarillos con símbolo negro (excepto la Cruz de San Andrés). Algunas, ligadas a usuarios vulnerables, son amarillo verdoso."}, {"id": "b6-17", "tema": "Señales y demarcaciones", "cap": "6 · pág. 81", "q": "En una autopista, ¿de qué color son en general las señales informativas de destino?", "ops": ["Verdes", "Azules", "Naranjas", "Rojas"], "ok": 1, "exp": "Informativas: azules en autopistas y autovías, verdes en otras vías, y café para atractivos turísticos."}, {"id": "b6-18", "tema": "Señales y demarcaciones", "cap": "6 · pág. 81", "q": "Ve señales de color NARANJA en la carretera. ¿Qué indican?", "ops": ["Atractivos turísticos de la zona", "Trabajos en la vía: peligro no permanente", "Servicios como bencineras o restaurantes", "Fin de autopista y cambio de límite"], "ok": 1, "exp": "Las transitorias son naranjas (la primera que advierte los trabajos es amarilla). Puede haber trabajadores, maquinaria, arena o ripio."}, {"id": "b6-19", "tema": "Señales y demarcaciones", "cap": "6 · pág. 82", "q": "La línea central es CONTINUA y tiene tachas reflectantes ROJAS. ¿Qué significa?", "ops": ["Que puede cruzarla con precaución", "Que no hay condiciones seguras para traspasarla", "Que marca el borde de una ciclovía", "Que indica una zona de estacionamiento"], "ok": 1, "exp": "Línea continua: no se traspasa. Línea discontinua (con tachas blancas): se puede traspasar avisando y sin riesgo para los demás."}, {"id": "b6-20", "tema": "Señales y demarcaciones", "cap": "6 · pág. 82", "q": "La línea central es MIXTA: continua de un lado y discontinua del otro. ¿Quién puede traspasarla?", "ops": ["Nadie: toda línea mixta es prohibida", "Sólo quienes tienen la línea discontinua de su lado", "Sólo quienes tienen la línea continua de su lado", "Todos, si hay buena visibilidad"], "ok": 1, "exp": "La línea que le «toca» primero es la que manda: si de su lado es discontinua, puede cruzar con seguridad; si es continua, no."}, {"id": "b6-21", "tema": "Señales y demarcaciones", "cap": "6 · pág. 82", "q": "¿Puede circular por la berma de una carretera para adelantar a vehículos lentos?", "ops": ["Sí, si hay espacio y no viene nadie", "No: sólo para detenerse en emergencias", "Sí, de noche con las luces encendidas", "Sí, a menos de 30 km/h"], "ok": 1, "exp": "La berma es una franja de seguridad lateral, no una pista."}, {"id": "b6-22", "tema": "Señales y demarcaciones", "cap": "6 · pág. 82", "q": "En la ciudad, la solera (borde de la vereda) está pintada con una franja AMARILLA continua. ¿Qué indica?", "ops": ["Zona de carga y descarga", "Prohibido estacionar", "Estacionamiento para discapacitados", "Borde de ciclovía"], "ok": 1, "exp": "Franja amarilla continua en la solera = prohibido estacionar. En caminos de montaña con nieve, las líneas de eje y borde también pueden ser amarillas."}, {"id": "b6-23", "tema": "Señales y demarcaciones", "cap": "6 · pág. 83", "q": "En un cruce con semáforo, entre la línea de detención y el paso peatonal hay una zona demarcada. ¿Para qué es?", "ops": ["Para estacionar momentáneamente", "Zona de espera para ciclos y/o motos", "Para los autos que van a virar", "Para que esperen los peatones"], "ok": 1, "exp": "Es la «línea de detención adelantada»: ciclistas y motociclistas pueden esperar ahí, delante de los autos."}, {"id": "b6-24", "tema": "Señales y demarcaciones", "cap": "6 · pág. 83", "q": "Un paso de cebra no tiene línea de detención pintada. ¿Dónde debe detenerse?", "ops": ["Encima del paso de cebra", "A no menos de un metro antes del paso", "Donde quiera, si no hay peatones", "Pasado el paso de cebra"], "ok": 1, "exp": "Siempre existe una línea de detención, aunque no esté pintada. Y en un paso de cebra, el peatón tiene prioridad."}, {"id": "b6-25", "tema": "Señales y demarcaciones", "cap": "6 · pág. 83", "q": "Una intersección está pintada con líneas AMARILLAS diagonales formando cuadros. ¿Qué significa?", "ops": ["Zona de estacionamiento rápido", "No bloquear cruce", "Paso de ciclistas en diagonal", "Paso de peatones en diagonal"], "ok": 1, "exp": "Se usa en vías congestionadas para q
