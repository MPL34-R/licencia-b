let BANCO = JSON.parse(document.getElementById("banco").textContent);

/* ====== Estado persistente ====== */
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let S = Object.assign({cajas:{}, vistos:{}, fallos:{}, examenes:[], fs:19, extra:[]}, load());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
// preguntas importadas se suman al banco
if (Array.isArray(S.extra)) mergeQuestions(S.extra, false);
document.documentElement.style.setProperty("--fs", S.fs+"px");

function mergeQuestions(arr, persist){
  let n=0;
  for (const q of arr){
    if(!q || !q.id || !q.q || !Array.isArray(q.ops) || typeof q.ok!=="number") continue;
    const i = BANCO.findIndex(x=>x.id===q.id);
    if (i>=0) BANCO[i]=q; else BANCO.push(q);
    n++;
    if (persist){ const j=S.extra.findIndex(x=>x.id===q.id); if(j>=0) S.extra[j]=q; else S.extra.push(q); }
  }
  if (persist) save();
  return n;
}

/* ====== Repetición espaciada (cajas de Leitner 0..5) ====== */
const caja = id => S.cajas[id] ?? 0;
const dominada = id => caja(id) >= 4;
function registrar(id, acierto){
  S.vistos[id] = (S.vistos[id]||0)+1;
  if (acierto) S.cajas[id] = Math.min(5, caja(id)+1);
  else { S.cajas[id] = 0; S.fallos[id] = (S.fallos[id]||0)+1; }
  save();
}
function sortear(lista, n){
  // las preguntas de cajas bajas salen mucho más seguido
  const pool = lista.map(q=>({q, w: Math.pow(2, 5-caja(q.id)) * (S.vistos[q.id]?1:1.5) * Math.random()}));
  pool.sort((a,b)=>b.w-a.w);
  return pool.slice(0,n).map(x=>x.q);
}
function barajar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const CAPS = {"1":"1 · Los siniestros de tránsito","2":"2 · Principios de la conducción","3":"3 · Convivencia vial","4":"4 · La persona en el tránsito","5":"5 · Usuarios vulnerables","6":"6 · Normas de circulación","7":"7 · Circunstancias especiales","8":"8 · Conducción eficiente","9":"9 · Informaciones importantes"};
function grupo(q){ if(q.tema==="Señales") return "🚸 Señales de tránsito"; const m=String(q.cap||"").match(/^(\d)/); if(m&&CAPS[m[1]]) return "Cap. "+CAPS[m[1]]; return "Licencia, examen y trámites"; }
function capLabel(c){ c=String(c||""); return /^\d/.test(c) ? "cap. "+c : c; }
const temas = () => { const g=[...new Set(BANCO.map(grupo))]; return g.sort((a,b)=>a.localeCompare(b,"es",{numeric:true})); };

/* ====== Lectura en voz alta (sin Internet si el teléfono tiene voz en español) ====== */
const TTS = "speechSynthesis" in window;
function hablar(t){ if(!TTS) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="es-CL"; u.rate=0.95;
  const v=speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }
function leer(){ const c=E||P; if(!c) return; const q=c.lista[c.i]; const ord=E?E.orden[E.i]:P.orden;
  const fb=document.querySelector(".fb"); let t=q.q+". "+ord.map((k,j)=>"ABCD"[j]+": "+q.ops[k]).join(". ");
  if(fb) t=fb.innerText.replace(/[✔✘]/g,""); hablar(t); }

/* ====== Render ====== */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let timerId = null;

function home(){
  clearInterval(timerId);
  const tot = BANCO.length, dom = BANCO.filter(q=>dominada(q.id)).length;
  const pend = BANCO.filter(q=>S.fallos[q.id] && caja(q.id)<2).length;
  const ult = S.examenes.slice(-1)[0];
  app.innerHTML = `
  <div class="top"><h1>Licencia Clase B</h1>
    <button class="iconbtn" onclick="ajustes()">⚙︎</button></div>
  <p class="muted">Práctica para el examen teórico · funciona sin Internet</p>
  ${avisoInstalar()}
  <div class="card">
    <div class="row"><span>Preguntas dominadas</span><span class="pill">${dom} / ${tot}</span></div>
    <div class="bar" style="margin-top:8px"><i style="width:${tot?Math.round(dom*100/tot):0}%"></i></div>
    ${ult?`<p class="muted" style="margin-top:8px">Último simulacro: <b>${ult.pts}/38</b> ${ult.pts>=33?"✅ aprobado":"❌ (se necesitan 33)"}</p>`:""}
  </div>
  <button class="big primary" onclick="iniciarPractica(sortear(BANCO,10),'Repaso rápido')"><b>⚡ Repaso rápido · 10 preguntas</b><span>5 minutos. Ideal después del trabajo.</span></button>
  <button class="big" onclick="iniciarExamen()"><b>📝 Simulacro de examen</b><span>35 preguntas · 45 min · aprueba con 33 de 38 puntos</span></button>
  <button class="big" onclick="elegirTema()"><b>📚 Estudiar por capítulo</b><span>9 capítulos del libro + señales</span></button>
  ${pend?`<button class="big" onclick="iniciarPractica(sortear(BANCO.filter(q=>S.fallos[q.id]&&caja(q.id)<2),15),'Mis errores')"><b>🔁 Repasar mis errores</b><span>${pend} pregunta(s) por reforzar</span></button>`:""}
  <p class="muted" style="margin-top:18px">Consejo: un repaso rápido cada día vale más que una sesión larga una vez por semana. Las preguntas que falla vuelven más seguido.</p>`;
}

function elegirTema(){
  app.innerHTML = `<div class="top"><h1>Por capítulo</h1><button class="iconbtn" onclick="home()">← Inicio</button></div>` +
   temas().map(t=>{
     const qs=BANCO.filter(q=>grupo(q)===t), d=qs.filter(q=>dominada(q.id)).length;
     return `<button class="big" onclick="iniciarPractica(sortear(BANCO.filter(q=>grupo(q)===${esc(JSON.stringify(t))}),12),${esc(JSON.stringify(t))})"><b>${esc(t)}</b><span>${d} de ${qs.length} dominadas</span><div class="bar" style="margin-top:6px"><i style="width:${Math.round(d*100/qs.length)}%"></i></div></button>`;
   }).join("");
}

/* ---- Modo práctica: corrección inmediata ---- */
let P = null;
function iniciarPractica(lista, titulo){
  if(!lista.length){ home(); return; }
  E = null; P = {lista, i:0, buenas:0, titulo};
  mostrarPregunta();
}
function preguntaHTML(q, orden){
  const L="ABCD";
  return `
   <div>${q.doble?'<span class="chip gold">Doble puntaje</span>':''}<span class="chip">${esc(q.tema)}</span></div>
   ${q.img&&SIGNS[q.img]?`<div class="sign">${SIGNS[q.img]}</div>`:""}
   <div class="q">${esc(q.q)} ${TTS?`<button class="iconbtn" style="padding:2px 8px" onclick="leer()" aria-label="Leer en voz alta">🔊</button>`:""}</div>
   ${orden.map((k,j)=>`<button class="opt" data-k="${k}" onclick="responder(${k},this)"><span class="l">${L[j]}</span><span>${esc(q.ops[k])}</span></button>`).join("")}
   <div id="fb"></div>`;
}
function mostrarPregunta(){
  const q = P.lista[P.i];
  P.orden = barajar(q.ops.map((_,k)=>k));
  app.innerHTML = `<div class="top"><span class="muted">${esc(P.titulo)} · ${P.i+1}/${P.lista.length}</span><button class="iconbtn" onclick="home()">✕</button></div>
   <div class="bar"><i style="width:${P.i*100/P.lista.length}%"></i></div>
   <div class="card">${preguntaHTML(q, P.orden)}</div>`;
  window.scrollTo(0,0);
}
function responder(k, btn){
  if (E) return responderExamen(k, btn);
  const q = P.lista[P.i], ok = k===q.ok;
  registrar(q.id, ok); if(ok) P.buenas++;
  document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; const kk=+b.dataset.k;
    if(kk===q.ok) b.classList.add("good"); else if(kk===k) b.classList.add("wrong"); });
  document.getElementById("fb").innerHTML = `<div class="fb ${ok?"good":"wrong"}"><b>${ok?"✔ ¡Correcto!":"✘ No es correcto"}</b>${ok?"":`Respuesta correcta: <b style="display:inline">${esc(q.ops[q.ok])}</b><br>`}${esc(q.exp||"")}<small class="ref">📖 Libro para la Conducción en Chile (2026) · ${esc(capLabel(q.cap))}</small></div>
   ${TTS?`<button class="iconbtn" onclick="leer()" style="margin-top:6px">🔊 Escuchar la explicación</button>`:""}<button class="next" onclick="siguiente()">${P.i+1<P.lista.length?"Siguiente →":"Ver resultado"}</button>`;
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function siguiente(){
  if(TTS) speechSynthesis.cancel();
  P.i++;
  if (P.i < P.lista.length) return mostrarPregunta();
  const n=P.lista.length;
  app.innerHTML = `<div class="card" style="text-align:center"><p class="muted">${esc(P.titulo)}</p><div class="stat">${P.buenas} / ${n}</div>
   <p>${P.buenas===n?"¡Perfecto! 🎉":P.buenas>=n*0.8?"¡Muy bien! Siga así.":"Las que falló volverán pronto. Así se aprende."}</p></div>
   <button class="big primary" onclick="iniciarPractica(sortear(BANCO,10),'Repaso rápido')"><b>Otro repaso rápido</b></button>
   <button class="big" onclick="home()"><b>Volver al inicio</b></button>`;
}

/* ---- Modo examen: sin corrección hasta el final ---- */
let E = null;
function iniciarExamen(){
  const dobles = barajar(BANCO.filter(q=>q.doble)).slice(0,3);
  const resto = barajar(BANCO.filter(q=>!dobles.includes(q))).slice(0, 35-dobles.length);
  const lista = barajar(dobles.concat(resto));
  E = {lista, i:0, resp:{}, orden:lista.map(q=>barajar(q.ops.map((_,k)=>k))), fin: Date.now()+45*60*1000, dobles:new Set(dobles.map(q=>q.id))};
  P = null;
  clearInterval(timerId); timerId = setInterval(tick, 1000);
  mostrarExamen();
}
function tick(){
  const t = Math.max(0, E.fin-Date.now()), el=document.getElementById("tmr");
  if(el) el.textContent = `${Math.floor(t/60000)}:${String(Math.floor(t/1000)%60).padStart(2,"0")}`;
  if(t<=0) terminarExamen();
}
function mostrarExamen(){
  const q=E.lista[E.i];
  const qq = Object.assign({}, q, {doble: E.dobles.has(q.id)});
  app.innerHTML = `<div class="top"><span class="muted">Simulacro · ${E.i+1}/${E.lista.length} · ⏱ <span class="timer" id="tmr"></span></span><button class="iconbtn" onclick="if(confirm('¿Abandonar el simulacro?')){E=null;home()}">✕</button></div>
   <div class="dots">${E.lista.map((x,j)=>`<i class="${E.resp[x.id]!==undefined?"a":""}" onclick="E.i=${j};mostrarExamen()"></i>`).join("")}</div>
   <div class="card">${preguntaHTML(qq, E.orden[E.i])}</div>
   <div class="row"><button class="iconbtn" ${E.i?"":"disabled"} onclick="E.i--;mostrarExamen()">← Anterior</button>
   ${E.i+1<E.lista.length?`<button class="iconbtn" onclick="E.i++;mostrarExamen()">Siguiente →</button>`:`<button class="iconbtn" style="background:var(--brand);color:var(--brand-ink)" onclick="terminarExamen()">Terminar y corregir</button>`}</div>`;
  const r=E.resp[q.id]; if(r!==undefined) document.querySelector(`.opt[data-k="${r}"]`)?.classList.add("sel");
  tick(); window.scrollTo(0,0);
}
function responderExamen(k){
  E.resp[E.lista[E.i].id]=k;
  if (E.i+1<E.lista.length){ E.i++; mostrarExamen(); } else mostrarExamen();
}
function terminarExamen(){
  clearInterval(timerId);
  const sin = E.lista.filter(q=>E.resp[q.id]===undefined).length;
  let pts=0, max=0; const errores=[];
  for(const q of E.lista){ const v=E.dobles.has(q.id)?2:1; max+=v; const ok=E.resp[q.id]===q.ok;
    if(E.resp[q.id]!==undefined) registrar(q.id, ok); if(ok) pts+=v; else errores.push(q); }
  const escala = max===38 ? pts : Math.round(pts*38/max);
  S.examenes.push({fecha:Date.now(), pts:escala}); save();
  const aprob = escala>=33;
  app.innerHTML = `<div class="card" style="text-align:center"><p class="muted">Resultado del simulacro</p>
    <div class="stat" style="color:${aprob?"var(--ok)":"var(--bad)"}">${escala} / 38</div>
    <p><b>${aprob?"✅ APROBADO":"❌ REPROBADO"}</b> · se necesitan 33 puntos</p>
    ${sin?`<p class="muted">${sin} pregunta(s) sin responder</p>`:""}
    ${max!==38?`<p class="muted">(El banco aún tiene pocas preguntas dobles: puntaje ajustado a 38.)</p>`:""}</div>
   ${errores.length?`<h2>Sus errores (${errores.length})</h2>`+errores.map(q=>`<div class="card"><div>${E.dobles.has(q.id)?'<span class="chip gold">Doble</span>':''}<span class="chip">${esc(q.tema)}</span></div>
     ${q.img&&SIGNS[q.img]?`<div class="sign">${SIGNS[q.img]}</div>`:""}<div class="q">${esc(q.q)} ${TTS?`<button class="iconbtn" style="padding:2px 8px" onclick="leer()" aria-label="Leer en voz alta">🔊</button>`:""}</div>
     ${E.resp[q.id]!==undefined?`<p style="color:var(--bad)">✘ ${esc(q.ops[E.resp[q.id]])}</p>`:`<p class="muted">Sin responder</p>`}
     <p style="color:var(--ok)">✔ ${esc(q.ops[q.ok])}</p><p class="muted">${esc(q.exp||"")}</p></div>`).join(""):"<p>¡Sin errores!</p>"}
   <button class="big primary" onclick="E=null;home()"><b>Volver al inicio</b></button>`;
  E=null; window.scrollTo(0,0);
}

/* ---- Ajustes ---- */
function ajustes(){
  const hist = S.examenes.slice(-8).reverse();
  app.innerHTML = `<div class="top"><h1>Ajustes</h1><button class="iconbtn" onclick="home()">← Inicio</button></div>
  <div class="card"><b>Tamaño de letra</b>
    <div class="row" style="margin-top:8px"><button class="iconbtn" onclick="letra(-1)">A−</button><span>${S.fs}px</span><button class="iconbtn" onclick="letra(1)">A+</button></div></div>
  <div class="card"><b>Historial de simulacros</b>
    ${hist.length?`<table>${hist.map(h=>`<tr><td>${new Date(h.fecha).toLocaleDateString("es-CL")}</td><td>${h.pts}/38 ${h.pts>=33?"✅":"❌"}</td></tr>`).join("")}</table>`:`<p class="muted">Todavía no hay simulacros.</p>`}</div>
  <div class="card"><b>Actualizar preguntas</b>
    <p class="muted">Banco base: ${BANCO.length-S.extra.length} preguntas (versión ${VERSION_BANCO}). Importadas: ${S.extra.length}.</p>
    <p class="muted">Puede cargar un archivo <code>.json</code> con preguntas nuevas o corregidas (mismo formato). Se suman al banco y se conservan en este teléfono.</p>
    <input type="file" accept=".json,application/json" onchange="importar(this.files[0])"><p id="impmsg" class="muted"></p></div>
  <div class="card"><b>Borrar progreso</b><p class="muted">Pone todas las preguntas a cero (no borra las importadas).</p>
    <button class="iconbtn" style="color:var(--bad)" onclick="if(confirm('¿Borrar todo el progreso?')){S.cajas={};S.vistos={};S.fallos={};S.examenes=[];save();home()}">Borrar progreso</button></div>
  <p class="muted">Preguntas basadas en el <b>Libro para la Conducción en Chile – Clase B</b> (CONASET, febrero 2026). Cada corrección indica la página del libro. Herramienta de práctica no oficial: las preguntas del examen real son otras.</p>`;
}
function letra(d){ S.fs=Math.min(26,Math.max(15,S.fs+d)); document.documentElement.style.setProperty("--fs",S.fs+"px"); save(); ajustes(); }
function importar(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ let msg; try{ const d=JSON.parse(r.result); const arr=Array.isArray(d)?d:(d.preguntas||[]); const n=mergeQuestions(arr,true); msg=`✔ ${n} pregunta(s) importada(s).`; }catch(e){ msg="✘ Archivo no válido."; }
    ajustes(); document.getElementById("impmsg").textContent=msg; };
  r.readAsText(f);
}
/* ====== Modo app (PWA): funciona sin Internet una vez instalada ====== */
const ENLINEA = /^https?:$/.test(location.protocol);
if (ENLINEA && "serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(()=>{}); }
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const INSTALADA = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
function avisoInstalar(){
  if (!ENLINEA || INSTALADA || S.ocultarAviso) return "";
  const pasos = IOS
    ? "En Safari, toque el botón <b>Compartir</b> (cuadrado con flecha ↑) y luego <b>«Agregar a pantalla de inicio»</b>."
    : "En Chrome, toque el menú <b>⋮</b> y luego <b>«Agregar a pantalla de inicio»</b> o <b>«Instalar aplicación»</b>.";
  return `<div class="card" style="border-color:var(--brand)"><b>📲 Instale la aplicación</b><p class="muted" style="margin-top:4px">${pasos} Así funcionará sin Internet y guardará su progreso.</p><button class="iconbtn" onclick="S.ocultarAviso=true;save();home()">Entendido</button></div>`;
}
home();
</script>
</body>
</html>
